[project]
name = "loop"
version = "0.1.0"
description = "Append-only research harness for a tool-calling agent loop"
requires-python = ">=3.8"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py38"
line-length = 120
exclude = [".logs", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
