name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline (python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: python -m compileall -q harness tui run.py
      - name: line and tui audits
        run: |
          python run.py check lines
          python run.py check tui
      - name: contract
        run: python scripts/check_manifest.py
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: manifest checks
        run: python scripts/verify.py --skip-server
      - name: secret hygiene
        run: |
          pattern='sk-[A-Za-z0-9_-]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|npm_[A-Za-z0-9]{20,}|pypi-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY'
          matches="$(git grep -nIE "$pattern" -- . || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "possible API key or private key in tracked files"
            exit 1
          fi
      - name: git hygiene
        run: |
          test -z "$(git status --porcelain)"

  mobile:
    name: mobile (flutter stable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: analyze
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: test
        working-directory: mobile
        run: flutter test --no-pub
