name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m compileall -q harness tui run.py
      - name: line and tui audits
        run: |
          python run.py check lines
          python run.py check tui
      - name: contract
        run: python scripts/check_manifest.py
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: manifest checks
        run: python scripts/verify.py --skip-server
      - name: secret hygiene
        run: |
          pattern='sk-[A-Za-z0-9_-]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY'
          matches="$(git grep -nIE "$pattern" -- . || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "possible API key or private key in tracked files"
            exit 1
          fi
      - name: git hygiene
        run: |
          test -z "$(git status --porcelain)"
