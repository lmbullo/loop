schema: loop-agent-doc/1
id: map
title: Tree map
read_when: [find the owning module, find an entry point, find who writes state]
source: [manifest.entrypoints, manifest.files, modules]
verify: [python3 scripts/repo_map.py, python3 scripts/check_manifest.py]

dispatch:
  entry: run.py
  rule: argv[1] -> manifest.entrypoints[] -> import module.function (default main); no second top-level script
  usage: run.py prints manifest purpose and entrypoint rows on no args or unknown command
  version: "-v, --v and --version print loop <manifest.version>; --help prints the top-level flags"
  options: "api parses options until --: -h/--help prints api usage, an unknown -option or a second positional exits 2 before any run is queued, and -- allows a task that starts with -"
  index: "--json prints one compact loop-index/1 line from manifest.agent_index; no module import, no tree walk, no absolute paths"

entrypoints:
  - {id: api, module: harness.agent, network: true, verify: "--verify CMD runs after the terminal turn, before end", writes: [daemon queue, job, worker registry, record, lock, obs]}
  - {id: server, module: harness.server, network: false, writes: [socket, pid, log, registry, queue, jobs, workers, reload, mobile token and listener, records and record locks through reconcile]}
  - {id: view, module: harness.view, network: false, writes: []}
  - {id: resume, module: harness.resume, network: true, writes: [existing record, lock, obs]}
  - {id: sim1, module: harness.sim1, network: false, writes: [".logs/sim1/<label>/"]}
  - {id: sim2, module: harness.sim2, network: false, writes: [".logs/sim2/<label>/"]}
  - {id: check, module: harness.checks, network: false, writes: []}
  - {id: tui, module: tui.app, network: false, writes: [queue through socket, registry and socket when it starts the daemon]}
  - {id: probe, module: tui.probe, network: false, writes: []}

execution_model:
  api_client: starts or attaches to the daemon, submits a front-of-queue task, streams record bytes from disk
  worker: detached process; owns the run, the tree lock and the record writer
  server: control plane only; never executes a model turn
  resume: exception; executes in the client process and takes the tree lock itself
  second_api: queues a new front item and streams that run; it does not attach to the in-flight run

runtime_flow: |
  run.py api TASK
    -> srvctl.start()                 one daemon per tree
    -> srvconn "run"                  srvrun.target -> queue.add(front=True)
    -> srvwork.tick()                 promote current, then launch
    -> srvwork.launch()               job.write + detached worker
    -> worker.main(run_id)
         -> recwrite.acquire_tree()   .logs/run.lock
         -> recwrite.Writer(run_id)   .logs/runs/<run_id>/record.lock
         -> agent.run_task()
              -> fold record -> state
              -> writer.append("wire") once, before the first turn
              -> fold.context()       wire + turns + nudges -> messages
              -> api.call()           model
              -> turn.read_turn()     usage, message, text
              -> turn.run_calls()     exec/write/edit; done settles without dispatch
              -> writer.append("turn")
              -> turn.stop()          continue | one nudge | done/no_tool_call
              -> writer.append("nudge") only for the one silent-stop retry
              -> repeat until done, no_tool_call or cancel
         -> verifier.run()            only when the task declared a command
         -> writer.append("end")      the only completion marker
    -> client streams record events from disk until end/interrupted

view: never enters this flow; it reads record bytes and renders them.
lock_note: the tree lock serializes workers, so a queued second api waits behind the live run.

modules:
  turn_loop:
    - {path: harness/config.py, owns: "machine values: ROOT from __file__, root(), asset(), runs(), resolve(), env helpers"}
    - {path: harness/agent.py, owns: "run lifecycle: per-turn reload boundary, credentials, verify settlement, end"}
    - {path: harness/turn.py, owns: "one model turn: response parsing, canonical short call ids and compact args, tool-call dispatch, done-result validation, terminal/nudge stop policy"}
    - {path: harness/fold.py, owns: "pure record fold: totals, derived state, wire snapshot, pending verify, request messages"}
    - {path: harness/verifier.py, owns: "run the verify command through sh -c at the run root; exit code plus one evidence line"}
    - {path: harness/api.py, owns: "tool schemas, system header, per-run wire snapshot, model id, HTTP call"}
    - {path: harness/tools.py, owns: "exec, write, edit bodies and dispatch; exec forwards the bounded ledgered renderer"}
    - {path: harness/observe.py, owns: "2048-byte render_api bound, same=obs-N references, render_v1, render_v2"}
    - {path: harness/bound.py, owns: "inline shape for a bounded observation: whole head/tail lines filling the byte allowance, shown/elided ranges, byte-sized next sed slice"}
    - {path: harness/ledger.py, owns: "content-addressed observation memory derived from record events and saved artifacts"}
    - {path: harness/spawn.py, owns: "one literal-argv subprocess; timeout and OSError mapping"}
    - {path: harness/pricing.py, owns: "manifest rates, cost formula, hot reload by mtime"}
    - {path: harness/auth.py, owns: "LOOP_API_KEY, else LOOP_AUTH_FILE with deepseek.key"}
    - {path: harness/reload.py, owns: "reload generation and per-turn module re-import"}
  record:
    - {path: harness/record.py, owns: "run ids, paths, canonical JSON, UTC stamp, discovery"}
    - {path: harness/recread.py, owns: "parse, torn tail, record state, live listing state, scan rows"}
    - {path: harness/recschema.py, owns: "manifest record schema, envelope and payload checks"}
    - {path: harness/recwrite.py, owns: "append writer, per-run lock, tree lock, reconcile"}
    - {path: harness/view.py, owns: "pure text renderer and loop-view/1; --list, --schema"}
    - {path: harness/resume.py, owns: "rebuild messages from an interrupted record and continue"}
  control_plane:
    - {path: harness/server.py, owns: "command dispatch and _daemon/_worker internals"}
    - {path: harness/srvcmd.py, owns: "start, stop, restart, reload, status, list, runs, logs, _stale"}
    - {path: harness/srvctl.py, owns: "daemon spawn/probe/stop/clean-stale, log tail"}
    - {path: harness/srvdaemon.py, owns: "socket serve loop, registry entry, startup reconcile, supervisor thread"}
    - {path: harness/srvwork.py, owns: "supervisor: reap, promote queue, launch one worker"}
    - {path: harness/srvconn.py, owns: "socket command handlers; cancel and force-stop interruption; mobile_start/stop/status dispatch"}
    - {path: harness/mobile.py, owns: "server mobile CLI: private host default, roots, token load, daemon request and status output"}
    - {path: harness/mobserve.py, owns: "opt-in mobile HTTP listener: private bind and peer filter, bearer auth, request limits, lifecycle"}
    - {path: harness/mobapi.py, owns: "mobile routes over existing functions: directory allowlist, enqueue, snapshot, runs, run log"}
    - {path: harness/mobtoken.py, owns: "mobile bearer token: LOOP_MOBILE_TOKEN or .logs/mobile.token mode 0600"}
    - {path: harness/srvclient.py, owns: "client attach/stream/reconnect; api entry"}
    - {path: harness/srvrun.py, owns: "run targeting (always enqueue) and record tailing"}
    - {path: harness/srvsnap.py, owns: "snapshot/status views; current, queue, bounded done list, local_done"}
    - {path: harness/srvlist.py, owns: "registry views, prune, restart --all"}
    - {path: harness/srvwire.py, owns: "newline JSON framing, timeouts, per-run env key list"}
    - {path: harness/worker.py, owns: "detached executor: tree lock, writer, signals, job cleanup"}
    - {path: harness/workers.py, owns: "on-disk worker registry and pid+start liveness"}
    - {path: harness/queue.py, owns: "daemon-owned queue: add, promote, update, finish, drop, move"}
    - {path: harness/job.py, owns: "per-run payload under .logs/jobs/<run_id>.json"}
    - {path: harness/registry.py, owns: "state paths, socket path fallback, tree identity"}
    - {path: harness/regstore.py, owns: "locked, atomic JSON registry writes"}
    - {path: harness/regprobe.py, owns: "pid liveness, /proc start fingerprint, socket ping/probe"}
  mobile_app:
    - {path: mobile/lib/main.dart, owns: "Flutter entry point and app shell"}
    - {path: mobile/lib/api.dart, owns: "private-address guard, bearer HTTP client, JSON error mapping"}
    - {path: mobile/lib/models.dart, owns: "pure snapshot, task, log and directory models"}
    - {path: mobile/lib/store.dart, owns: "client state derived from server polling; saved connection, submit, browse, watch run"}
    - {path: mobile/lib/session.dart, owns: "last successful connection persisted with shared_preferences for auto-login"}
    - {path: mobile/lib/home.dart, owns: "app shell: Gruvbox header, tasks/activity/workspace tabs, floating composer and nav rail; keyboard-aware"}
    - {path: mobile/lib/navigation.dart, owns: "floating Gruvbox nav rail: animated destinations, haptics and safe-area inset"}
    - {path: mobile/lib/task_list.dart, owns: "task board: workspace strip, summary metrics and active/queued/done cards in one scrollable list"}
    - {path: mobile/lib/activity_view.dart, owns: "activity tab: run metrics and current/queued/recent timeline"}
    - {path: mobile/lib/workspace_view.dart, owns: "workspace tab: active root, allowlisted roots, bridge details, config and disconnect"}
    - {path: mobile/lib/task_rows.dart, owns: "rounded task and queue cards; task text and state lead, metadata defers to run detail"}
    - {path: mobile/lib/prompt_box.dart, owns: "floating task composer: rounded Gruvbox surface, borderless multiline field, queue action, keyboard spacing"}
    - {path: mobile/lib/dir_picker.dart, owns: "server-backed allowlisted directory navigation with a floating path bar, rounded rows and footer action"}
    - {path: mobile/lib/run_screen.dart, owns: "live call log and untruncated final summary; rounded call cards and a result callout"}
    - {path: mobile/lib/connect_pane.dart, owns: "Gruvbox host, port and bearer token card with token visibility and bridge hint"}
    - {path: mobile/lib/theme.dart, owns: "Gruvbox dark palette, spacing, radii, type roles, state icons and Material theme"}
    - {path: mobile/lib/widgets.dart, owns: "shared backdrop, header, connection chip, cards, pills, hairlines, error and empty states"}
    - {path: mobile/README.md, owns: "Android build/run and private-network setup"}
  sims_checks_tui:
    - {path: harness/sim1.py, owns: "offline v1 sim: exec only, head 600B + tail 400B, cache cost through pricing"}
    - {path: harness/sim2.py, owns: "offline v2 sim: shape-aware, 2000B inline, structured edit, cache cost through pricing"}
    - {path: harness/assets.py, owns: "scenario load/defaults and fresh fixture mount"}
    - {path: harness/checks.py, owns: "check lines (200-line audit), check tui layout contract"}
    - {path: harness/runlog.py, owns: "pure log projection: one entry per call plus full final result, interruption, error or pending tail"}
    - {path: tui/app.py, owns: "curses shell and raw input loop; button-event mouse tracking, drag-select highlight; one frame buffer per paint; task/queue viewport offsets carry across paints; invalidate on resize/ctrl-l"}
    - {path: tui/client.py, owns: "snapshot/enqueue/drop/move/cancel client; done history and run log from record bytes"}
    - {path: tui/cancel.py, owns: "ctrl+x cancel actions and queue selection clamp"}
    - {path: tui/frame.py, owns: "row-diffed frame buffer; changed rows only; reverse-video highlight spans; row text for copy; synchronized doupdate"}
    - {path: tui/clipboard.py, owns: "clipboard transports: OSC 52 with tmux passthrough, plus the first installed wl-copy/xclip/xsel/pbcopy helper"}
    - {path: tui/highlight.py, owns: "pure highlight geometry: merged screen spans, split draw ops, committed row text"}
    - {path: tui/mouse.py, owns: "SGR/X10 mouse decode and copy-on-select: anchor, drag, copy, clear, notice"}
    - {path: tui/select.py, owns: "pure selection geometry and covered text"}
    - {path: tui/input.py, owns: "key dispatch: prompt, log open/close, selection, wheel viewport scroll, cancel, queue drop/reorder"}
    - {path: tui/keys.py, owns: "raw byte parser: CSI/SS3 arrows, ctrl keys, paste, SGR/X10 wheel and left-button mouse events"}
    - {path: tui/indicator.py, owns: "one-cell scroll indicator: pure track/thumb window, no bar when rows fit, right-edge paint with a reserved content cell"}
    - {path: tui/loginput.py, owns: "log view state: run id, open/close/refresh, selection, free scroll, live tail"}
    - {path: tui/logview.py, owns: "log renderer: header, one fitted line per call, wrapped full summary, body-sized window, scroll indicator"}
    - {path: tui/model.py, owns: "render copy of snapshot (current, queue, done) and notices"}
    - {path: tui/nav.py, owns: "queue cursor clamp, flat selection mirror, pane handoff, task/queue free-scroll offsets and re-anchoring"}
    - {path: tui/panes.py, owns: "fit/clip, rules, running/queued/done rows, selection and free-scroll windows, task-section scroll indicators"}
    - {path: tui/probe.py, owns: "headless renderer: snapshot JSON to the exact plain lines"}
    - {path: tui/prompt.py, owns: "prompt buffer, cursor, history, display-width wrapping and scroll"}
    - {path: tui/render.py, owns: "themed renderer with frame-buffer fast path, task/queue viewport offsets and status line"}
    - {path: tui/rows.py, owns: "glyphs, short ids, separators, log rows, flat selection mapping, window helper"}
    - {path: tui/theme.py, owns: "grey scale plus muted state hues; init_colors"}
    - {path: tui/worker.py, owns: "snapshot polling, queue requests, selected log load"}
  support:
    - {path: install.sh, owns: "write a loop launcher to $HOME/.local/bin or /usr/local/bin; prefix/bindir, uninstall, force, dry-run"}
    - {path: scripts/verify.py, owns: "run manifest.checks[] offline; --skip-server, --only, --json, --list"}
    - {path: scripts/check_manifest.py, owns: "registered files, importable entries, record/check/scenario integrity"}
    - {path: scripts/repo_map.py, owns: "generated manifest map with line counts"}
    - {path: scripts/cache_audit.py, owns: "offline cache audit: rebuilds request prefixes from record bytes, reports hit/miss/out/cost, reuse references and suspected cache breaks"}
    - {path: scripts/doctor.py, owns: "local health; never starts the daemon"}
    - {path: scripts/commit_check.py, owns: "conventional subject plus why and check lines"}
    - {path: tests/support.py, owns: "sandbox env, fixed ids, event builders, CLI helper"}

write_ownership:
  ".logs/runs/<run_id>/record.jsonl": recwrite.Writer, held by one worker or resume
  ".logs/runs/<run_id>/record.lock": the executor Writer
  ".logs/runs/<run_id>/obs/": the executor tools/observe path
  ".logs/run.lock": recwrite.TreeLock in a worker or resume
  ".logs/queue.json": the daemon through queue.py
  ".logs/jobs/<run_id>.json": the daemon through srvwork.launch
  ".logs/workers/<run_id>.json": the worker, plus daemon reconcile updates
  ".logs/reload.json": reload.bump from server reload (CLI or socket)
  ".logs/mobile.token": mobile.load_token generated by server mobile start; read by the bridge, never by a worker
  ".logs/server.sock, .pid": the daemon
  ".logs/server.log": the daemon and workers
  ".logs/server.lock": srvctl.start
  "$LOOP_REGISTRY, .logs/registry.json": regstore under a file lock
  "scenarios/, fixtures/, records/": read-only; copy before using

imports:
  - tui/client.py is the only TUI module that imports harness server/state helpers
  - server modules must never import tui/
  - harness modules may import each other; run.py is the only entry
  - view, recread rendering and recschema validation never read daemon, network or cwd
  - no absolute paths; roots come from __file__, LOOP_ROOT or LOOP_RUNS

change_map:
  - {change: tool or observation shape, start: [harness/tools.py, harness/observe.py, harness/ledger.py], test: [tests/test_tools.py, tests/test_observe.py]}
  - {change: prompt prefix, wire snapshot, model or thinking budget, start: [harness/api.py, harness/agent.py, harness/fold.py, manifest.record], test: [tests/test_agent_context.py, tests/test_agent_loop.py, scripts/cache_audit.py]}
  - {change: turn loop, stop condition, end payload, start: [harness/agent.py, harness/turn.py, harness/fold.py], test: [tests/test_agent_context.py, tests/test_agent_loop.py, tests/test_view.py]}
  - {change: verify command, start: [harness/agent.py, harness/fold.py, harness/verifier.py], test: [tests/test_verify.py, tests/test_view.py]}
  - {change: record fields or state rules, start: [manifest.record, harness/recschema.py], test: [tests/test_recschema.py, tests/test_recread.py]}
  - {change: daemon command or guard, start: [harness/srvcmd.py, harness/srvconn.py], test: [tests/test_manifest.py, scripts/verify.py --skip-server]}
  - {change: queue or worker lifecycle, start: [harness/queue.py, harness/srvwork.py, harness/worker.py], test: [tests/test_queue.py, tests/test_workers.py]}
  - {change: TUI layout, keymap, palette or scroll indicator, start: [tui/panes.py, tui/rows.py, tui/theme.py, tui/indicator.py, tui/input.py, tui/keys.py, tui/nav.py, tui/render.py], test: [python3 run.py check tui, tests/test_tui_layout.py, tests/test_tui_indicator.py, tests/test_tui_taskscroll.py, tests/test_tui_input.py, tests/test_tui_keys.py, tests/test_tui_history.py]}
  - {change: TUI cancel, start: [harness/srvconn.py, tui/cancel.py, tui/input.py, tui/client.py, tui/worker.py], test: [tests/test_srv_cancel.py, tests/test_tui_cancel.py]}
  - {change: TUI log view, start: [harness/runlog.py, tui/logview.py, tui/loginput.py, tui/indicator.py, tui/rows.py, tui/keys.py], test: ["python3 run.py check tui", tests/test_tui_logs.py, tests/test_tui_indicator.py, tests/test_tui_loginput.py, tests/test_tui_summary.py]}
  - {change: TUI drag-select copy, start: [tui/mouse.py, tui/select.py, tui/clipboard.py, tui/highlight.py, tui/frame.py, tui/app.py, tui/keys.py], test: [tests/test_tui_mouse.py, tests/test_tui_select.py, tests/test_tui_keys.py, tests/test_tui_frame.py]}
  - {change: TUI redraw or live tail, start: [tui/frame.py, tui/app.py, tui/render.py, tui/loginput.py, tui/indicator.py], test: ["python3 run.py check tui", tests/test_tui_frame.py, tests/test_tui_live.py]}
  - {change: prompt over any view, start: [tui/input.py, tui/render.py, tui/prompt.py], test: [tests/test_tui_input.py, tests/test_tui_loginput.py, tests/test_tui_prompt.py]}
  - {change: offline scenario, start: [scenarios/, "manifest.scenarios[]"], test: ["python3 run.py sim1 <id>"]}
  - {change: sim wire or cache projection, start: [harness/sim1.py, harness/sim2.py, harness/observe.py, harness/pricing.py], test: [tests/test_pricing.py, tests/test_observe.py]}
  - {change: mobile task list, activity, workspace, prompt, run detail or shared chrome, start: [mobile/lib/home.dart, mobile/lib/navigation.dart, mobile/lib/task_list.dart, mobile/lib/activity_view.dart, mobile/lib/workspace_view.dart, mobile/lib/task_rows.dart, mobile/lib/prompt_box.dart, mobile/lib/run_screen.dart, mobile/lib/connect_pane.dart, mobile/lib/dir_picker.dart, mobile/lib/theme.dart, mobile/lib/widgets.dart], test: [mobile/test/layout_test.dart, mobile/test/widget_test.dart]}
  - {change: mobile bridge route, token or lifecycle, start: [harness/mobile.py, harness/mobapi.py, harness/mobserve.py, harness/mobtoken.py], test: [tests/test_mobile_api.py, tests/test_mobile_http.py]}
  - {change: new doc, start: [docs/agent/], test: ["manifest.files[]", docs/agent/index.yaml]}
