schema: loop-agent-doc/1
id: wire
title: "Agent wire: tools, observations, cost"
read_when: [change a tool, change observation bounding, change the stop condition, change verify behavior, reason about cost]
source: [harness/api.py, harness/agent.py, harness/turn.py, harness/fold.py, harness/tools.py, harness/cmds.py, harness/read.py, harness/edits.py, harness/observe.py, harness/bound.py, harness/ledger.py, harness/spawn.py, harness/verifier.py, harness/pricing.py, manifest.wire, manifest.cost_model, manifest.env]
verify: ["python3 -m unittest tests.test_agent_context tests.test_agent_loop tests.test_length_nudge tests.test_turn_budget tests.test_verify tests.test_observe tests.test_bound tests.test_tools tests.test_cmds tests.test_read tests.test_edits tests.test_bad_args tests.test_spawn tests.test_pricing tests.test_context_compact tests.test_loop_compaction tests.test_retry tests.test_obs_read", python3 run.py sim1 edge, python3 run.py sim2 edge2]

messages:
  order: |
    system   wire.system                api.header() snapshotted at run start; no run-specific values
    user     run_start.task
    for each turn event:
      assistant  turn.message         content is null; a silent stop stores empty content and no tool_calls; tool_calls carry the calls
      tool       one per call         keyed by call.id, content is call.observation
    for each nudge event:
      user       nudge.text           after a silent stop (at most one per run) or after any length-truncated reply (repeats until a usable turn)
  rules:
    - reasoning_content is replayed in the assistant message because thinking mode rejects a missing field; it becomes part of the cached prefix after its turn; turn.usage.reasoning_c counts characters, not tokens
    - assistant prose text is not stored in the message and is never re-sent; a terminal reply is kept only as end.result
    - "non-empty terminal reply -> finish=done with result=content.strip()"
    - "a length finish is never executed, even when it carries a truncated tool call -> a length nudge on every truncated turn; the loop has no turn cap (tests/test_turn_budget.py exercises 400 turns); empty terminal reply on turn 1 -> finish=no_tool_call; after turn 1 with no earlier nudge -> one nudge user message and another turn; a second empty reply -> finish=no_tool_call"
    - a silent stop stores message.content="" and fold.context omits empty tool_calls (the API rejects []); a length turn is folded as an empty assistant turn with no tool_calls or reasoning so the nudge retries it cleanly; the nudge itself is a separate event
    - the prompt tells the model to call done(result); a second silent stop still loses the result
    - done ends the run; it is recorded in turn.done and end, not as a tool observation
    - the whole list is re-sent each turn; only the appended suffix is a cache miss
    - a wire event snapshots system, tool schema, model, max_tokens, thinking and renderer; resume and soft reload reuse it, so the static prefix cannot change mid-run; run_start.max_inline pins only the observation bound
    - tool-call ids are canonical short per-run names (c<turn>.<index>) and arguments are compact sorted JSON; provider ids and whitespace never re-enter the prefix
    - issue independent calls in one assistant message; the harness executes them in order
    - there is no text channel in the message list

request:
  endpoint: "LOOP_URL, default https://api.deepseek.com/chat/completions"
  body: "{model: \"wire.model, default LOOP_MODEL deepseek-flash\", messages: \"the folded list\", tools: \"wire.tools\", max_tokens: \"wire.max_tokens, default 65536\", thinking: \"wire.thinking, default {type: enabled, budget_tokens: LOOP_THINK_BUDGET 32768}\"}"
  wire: "loop-wire/2; at run start api.snapshot() records the request-static fields into a wire event, and later turns pass that snapshot to api.call, so a soft reload cannot change the cached prefix"
  wire_v2: "the header carries the tool lines rendered from tools.SIGNATURES plus one note each, so the block that used to name four tools by hand cannot drift from the dispatcher; a loop-wire/1 record still replays with its recorded system text and is never rewritten"
  auth: "Bearer LOOP_API_KEY, else LOOP_AUTH_FILE.deepseek.key"
  timeout: "LOOP_HTTP_TIMEOUT_S; 0 or unset (the default) means no urlopen timeout; a positive value is a per-call cap in seconds"

tools:
  source: harness/api.py TOOLS; run_start.tools records the five names in order
  spelling: harness/tools.py SIGNATURES is the one spelling of each call; api.signatures() renders the header lines from it plus one note per tool (api.NOTES), and tests/test_tools.py pins TOOLS names and order to SIGNATURES
  exec:
    signature: "exec(cmd?|argv?, cwd?, stdin?, timeout_ms?)"
    behavior: cmd runs through sh -c; argv spawns literally; return exit, duration, stdout, stderr
    details:
      - cmd alone, or argv alone; a str argv becomes ["sh","-c",str]; command is accepted as an alias for cmd; cwd and the command's effects persist nowhere, so batch with a compound cmd
      - no shell, globs, pipes, redirects or expansion for argv; use cmd or ["sh","-c","..."] when a shell is required
      - cwd resolves against the run root (LOOP_ROOT for api, the recorded root on resume) when relative; default cwd is .
      - default timeout is LOOP_EXEC_TIMEOUT_MS (600000 ms in production); 0 disables the per-command timeout; the model may pass timeout_ms per call; sims default to 10000 ms
      - a timeout kills the process group and reports code=TIMEOUT
      - "a spawn failure reports code=127 and TypeName: message on stderr"
      - stdin is encoded UTF-8; the runner starts a new session so the timeout can kill the group
      - no cmd and no argv list[str] returns 'err bad_args exec needs cmd:"<shell line>" or argv:["prog","arg"]'
      - a standalone shell operator token or a shell keyword in argv[0] returns err shell_syntax <detail> from harness/cmds.py; exec has no shell, so use cmd
      - output is always exit=<code> ms=<dur> followed by the bounded payload
  read:
    signature: "read(path, start?, end?, find?, ctx?, offset?)"
    behavior: "numbered lines of one file, paged; prints shown a-b of N and one executable next: call"
    details:
      - "path is resolved against the run root; a directory yields \"obs <path> kind=dir entries=<n>\" plus names with / on directories, and a next: call when the list is cut"
      - start and end are 1-based inclusive; start clamps to 1..total, end<=0 or absent means total, end below start collapses to start; rows render as "<n>| <line>" with an aligned number width
      - find is a regular expression (invalid regex falls back to a literal substring) and each hit keeps ctx context lines; overlapping or adjacent hit ranges merge; at most 12 groups; no hit returns "obs <path> lines=<n> matches=0 hint=check find, or pass start/end"
      - "offset is a byte offset into the file and pages one long line: \"obs <path> bytes=<n> offset=<start>\" plus utf8-safe text and a next: read(path=..., offset=<next byte>) when bytes remain; it wins over start/end/find"
      - "every shape ends in at most one continuation line, \"next: read(path=P, start=N)\" or \"next: read(path=P, offset=N)\"; P is quoted only when it holds a space or a quote"
      - the row budget is LOOP_READ_INLINE (8192 bytes) or the run max_inline; lines that do not fit are cut by bound.cut and the first omitted line number becomes start in next:
      - binary content returns "kind=binary <path> bytes= sha256= head_hex=", like an observation digest, and empty files return "obs <path> lines=0 bytes=0" plus "(empty)"
      - "a missing path or an OSError returns \"err read <path>: <strerror>\""
      - a missing or empty path returns "err bad_args read requires path:str; optional start, end, find, ctx, offset"
      - "no shell quoting, no globs and no refetch: run the printed next: line literally, and read a saved obs file the same way"
  write:
    signature: "write(path, data, append?)"
    behavior: write UTF-8 at path; replace unless append is exactly true; create parents
    details:
      - data must be str; content is accepted as an alias for data and adds note=content taken as data
      - a missing or non-str data returns "err bad_args write needs path:str and data:str, got data=<Type>; for a large body send two calls with append=true"
      - a missing or empty path returns err bad_args write needs path:str and data:str
      - success is "ok wrote <n>B <path>" plus " replaced=<prior>B" or " appended_to=<prior>B" when the file existed
      - append is true only when the JSON value is exactly true; any other value replaces
  edit:
    signature: "edit(path, old?, new?, edits?, replace_all?)"
    behavior: replace unique spans atomically in one call; a miss changes nothing
    details:
      - "three accepted shapes: old+new, edits:[{old,new}, ...], or find+replace; edits[] must be a non-empty list whose every hunk has old:str and new:str"
      - "hunks apply in order to the evolving bytes and the file is written once at the end, so the batch is all-or-nothing: one failing hunk leaves the original bytes intact"
      - each hunk must match exactly once unless replace_all is exactly true; old must not be empty
      - one matching old is still one hunk; independent edits belong in edits[] or in parallel calls of one assistant message
      - a miss returns "err match=<n> expected=1 <path>" plus diagnostics and does not change the file; with more than one hunk it is prefixed "hunk=<i>/<n> "
      - multiple matches add "lines=<1-based line numbers>" and hint=extend old with adjacent unique text, or pass replace_all=true; zero matches add near=<line> hint=check whitespace/indent, or hint=file uses CRLF; include \\r\\n in old, or lines=<first signature line> hint=old text differs from this line, or hint=old not found; read the file and copy its exact bytes
      - a missing file adds hint=create it with write(path=<path>, data=...) when the error is ENOENT
      - success is "ok -<old bytes> +<new bytes> <path>" (prefixed "ok edits=<n> " for a batch, suffixed " all=true" under replace_all) with "lines=<match lines>" and a numbered window of the changed region, so no read turn is needed to confirm
  done:
    signature: "done(result)"
    behavior: finish the task; result goes to turn.done.result and end.result
    details:
      - result must be str; a non-str result becomes err bad_args done requires result:str, got <Type> and the run continues
    dispatch: not dispatched; harness/turn.py sets turn.done and breaks the call list; any other name returns err unknown_tool <name> expected one of exec, read, write, edit, done plus the signatures line

verify:
  entry: "run.py api --verify CMD [--] [TASK|-]"
  transport: task request field verify -> queue item -> job -> worker spec -> agent.run_task
  root: run root (run_start.root); not the client cwd
  shell: sh -c CMD with a fixed 120000 ms timeout and process-group kill; LOOP_EXEC_TIMEOUT_MS applies only to the exec tool
  evidence: first non-blank stdout+stderr line cut to 180 chars plus " ms=<duration>"; no output is "no output ms=<duration>"
  order: "declare before the first turn: {command, ran:false, exit:null, note:null}; after done or a terminal reply, append {ran:true, exit, note} before end"
  pass_fail: the event stores exit; view renders ok=1 when exit is 0 and ok=0 otherwise; status never gates the run
  absent: no command means no verify event; view renders absence, never a pass
  resume: fold.pending_verify recovers the declared command; a ran=true event is final and is not rerun
  run_editor: report only; the command runs at the run root with the worker's filesystem access and is not sandboxed

observation:
  default_bound: 2048 bytes (LOOP_MAX_INLINE, renderer obs/2); run_start.max_inline pins it
  production_input: 'stdout + "\n--stderr--\n" + stderr when stderr is non-empty'
  cases:
    - {when: binary sample, output: "kind=binary bytes=<n> sha256=<16 hex> head_hex=<24 bytes>"}
    - {when: "len(raw) <= run max_inline", output: raw UTF-8 text, verbatim}
    - {when: larger text, output: "obs bytes=<n> lines=<n> sha=<12 hex> saved=<root-relative path>; then shown 1-<a> of <n>[; elided <a+1>-<b>], head:/tail: whole lines filling the byte bound, stderr_tail: up to 2 lines when stderr was not already shown, and one next: continuation: sed -n <a+1>,<c>p <path> when lines are elided, or tail -c +<byte> <path> when a shown line was cut or the payload is one over-bound line; following it always advances without losing bytes"}
    - {when: byte-identical to an earlier observation in the run, output: "same=obs-<k> bytes=<n> [saved=<path>] [next: sed -n <a>,<b>p <path> | tail -c +<byte> <path>]"}
    - {when: no output, output: empty string}
  bounding:
    - "valid UTF-8 text is never binary: only control bytes (<9, 14..31, 127) count, so non-ASCII characters stay readable; an invalid sample falls back to the byte rule (>20% of the first 4096 bytes outside printable ASCII)"
    - a multi-byte character cut by the 4096-byte sample boundary still counts as text
    - binary output is not saved; the digest is the only recoverable description
    - large text is saved at .logs/runs/<run_id>/obs/obs-<k>.txt; k counts dispatched tool observations over the run; done and malformed-argument calls do not consume a name
    - saved paths are root-relative (.logs/runs/<run_id>/obs/obs-<k>.txt), so the agent reads one from the run cwd without knowing the run id; an obs dir outside the run root yields an absolute path
    - head and tail lines are cut to 200 characters (bound.LINE_WIDTH); a cut line emits tail -c +<byte> so no byte is unreachable; a single over-bound line fills the byte allowance and resumes with tail -c; a line appears once; when the text has at most 11 lines the two halves cover every line
    - the ledger is derived from record events plus saved artifacts, so resume rebuilds the same sha->obs map; an exact repeat becomes a one-line reference because the earlier payload is already in the append-only message list
    - "follow next: literally: sed -n for hidden lines, tail -c +n for a cut line; re-reading the whole saved file is summarized again"
    - call.bytes is the byte length of the rendered observation, not the raw subprocess payload; call.saved is set when a large text file was saved, including a reference to an earlier archive
    - "why 2048: recorded observations have p75 ~2.3KB and p90 ~6KB; the 2KB bound keeps ordinary calls verbatim, and the summary now spends that bound on whole head/tail lines (median ~40 visible lines, ~56% of a saved payload) plus a byte-sized next slice, so one read replaces several chunked probes"

failures:
  rule: tool errors are observations, not harness crashes; the model decides whether to retry
  bad_args_rule: "an unparseable call is never dispatched; it becomes \"err bad_args <fn> not dispatched: <why>; re-send the call as one JSON object\" and the recorded arguments keep the caller's raw text"
  table:
    - {trigger: "arguments is not valid JSON, is empty, or is not one object", observation: "err bad_args <fn> not dispatched: <why>; re-send the call as one JSON object"}
    - {trigger: "exec has neither cmd nor argv:list[str]", observation: "err bad_args exec needs cmd:\"<shell line>\" or argv:[\"prog\",\"arg\"]"}
    - {trigger: "write missing, empty or non-str data", observation: "err bad_args write needs path:str and data:str, got data=<Type>; for a large body send two calls with append=true"}
    - {trigger: "write missing or empty path", observation: "err bad_args write needs path:str and data:str"}
    - {trigger: "read missing or empty path", observation: "err bad_args read requires path:str; optional start, end, find, ctx, offset"}
    - {trigger: "edit missing or empty path", observation: "err bad_args edit needs path:str"}
    - {trigger: "edit carries none of old+new, edits[], find+replace", observation: "err bad_args edit needs path, then old:str + new:str, edits:[{old,new}, ...] or find+replace"}
    - {trigger: "edit edits[] is empty or a hunk lacks old or new", observation: "err bad_args edit edits must be a non-empty list of {old,new} | err bad_args edit edits[<i>] needs old:str and new:str"}
    - {trigger: "edit old is empty", observation: "err bad_args edit old must not be empty"}
    - {trigger: "edit hunk match count is not 1", observation: "[hunk=<i>/<n> ]err match=<n> expected=1 <path> [lines=... | near=... | hint=file uses CRLF]"}
    - {trigger: "done result is not a str", observation: "err bad_args done requires result:str, got <Type>"}
    - {trigger: "read hits a missing path or an OSError", observation: "err read <path>: <strerror>"}
    - {trigger: "exec argv carries a standalone shell operator or a shell keyword at argv[0]", observation: "err shell_syntax <detail>; exec has no shell. Use cmd:\"...\" for pipes, redirects or compound commands"}
    - {trigger: "tool name is not exec, read, write, edit or done", observation: "err unknown_tool <name> expected one of exec, read, write, edit, done; signatures: <SIGNATURES>"}
    - {trigger: "tool body raises", observation: "err harness <TypeName>: <detail>; exec argv or cmd, read path, write path+data, edit path+old+new or edits"}
    - {trigger: "file open or write fails", observation: "err <TypeName>: <detail>"}
  malformed_rule: every row above is appended as the call observation and the turn continues; a malformed-arguments call is also left undispatched and consumes no obs name

cost:
  rates: manifest.cost_model.pricing_per_1M, re-read when the manifest mtime/size changes
  formula: (hit * cache_hit + miss * cache_miss + out * completion) / 1e6
  defaults: {cache_hit: 0.006, cache_miss: 0.30, completion: 1.20}
  inputs:
    hit: prompt_cache_hit_tokens
    miss: prompt_cache_miss_tokens
    out: completion_tokens
    reasoning_c: len(reasoning_content); informational, not in the formula
  accounting:
    - each turn.usage.cost is rounded to 6 decimals
    - end sums hit, miss, out, reasoning_c and computes the run cost once
    - "output is completion tokens: reasoning + tool arguments + result; scripts/output_audit.py splits the recorded total"
    - the unchanged prefix is a cache hit; only the appended suffix is a miss; output bills highest; because reasoning_content is replayed, it joins the cached prefix after its turn
    - the sim projection uses bytes/4 as tokens and pricing.cost, so rates come from the manifest
  audit: "python3 scripts/cache_audit.py [RUN_ID] [--json] replays the recorded prefixes offline; prefix_ok=True and no suspected cache breaks mean the static prefix only grew; make audit RUN=<id> is the wrapper"
  call_audit: "python3 scripts/call_audit.py [RUN_ID] [--json] (loop-call-audit/1) replays the recorded calls: per-run call names and argument shapes, fail kinds, repeated or refetched reads and the hit/miss/out/reasoning_c split; no model call"
  output_audit: "make output RUN=<id> wraps python3 scripts/output_audit.py [RUN_ID] [--json]; it splits completion tokens into reasoning, tool arguments and result, names the turns with the largest output and counts length truncations; no model call"

header:
  function: api.header()
  content: append-only messages, one JSONL event per fsynced record line, end as the only completion marker, one run per tree, literal argv, the cost model, output rules (reason as deeply as needed, smallest change, chunked writes only when a file is too large, uncapped result), done and one-nudge stop semantics with unlimited length retries, parallel-call and repeated-probe-script guidance, large-observation guidance, and five tool signatures rendered from tools.SIGNATURES
  stability: constant bytes for every run; no max_inline, task, root or model value enters it, so the first system message is a reusable cache prefix; each run also stores the text in its wire event
  migration: records with no wire event replay with the current api.header(); a resumed old run appends a wire event before its next turn, paying one prefix change
  refresh: a soft reload may re-import api, but the worker passes the run's recorded wire snapshot to context and call, so the static prefix does not change mid-run; new runs pick up edited text

sims:
  note: experiments, not the production wire
  sim1:
    inline: payload <=1000B inline; else head 600B + tail 400B + saved file
    saved_name: "<label>-<n>.txt"
    notes: exec only; no binary detection; output shape "$ code=<code> out=<n>B dur=<ms>ms"
  sim2:
    inline: ANSI stripped; empty -> ""; binary -> sha256+head_hex; >2000B -> shape + saved file
    saved_name: o<n>.txt
    notes: exec plus structured edit; blank runs collapsed; output shape "$ code=<code> out=<n>B <body>"
    detail: saves the full payload when it exceeds 2000 bytes and inlines the first 2000 bytes only when the payload has at most 40 newlines; the binary digest has no bytes= or saved file
  scenarios: see docs/agent/WORKFLOWS.yaml for scenario commands and the fixture contract

long_run:
  context: "the request is rebuilt from record bytes; a compact event is the only intentional prefix break"
  compaction:
    watermark: "LOOP_CONTEXT_HIGH estimated prompt tokens; LOOP_CONTEXT_LOW target tail; LOOP_KEEP_TURNS verbatim floor"
    digest: "deterministic memo over turns <= after: changed files, failures, recent commands; no model call and no clock"
    event: "compact {after, from, count, digest, state, bytes, tokens, prompt}; the next request is system + task + digest + turns > after"
    hysteresis: "when the post-compact floor is already above high, the next compact waits for floor + max(1024, high/4) so the prefix does not change every turn"
  retry:
    transient: "HTTP 408/409/425/429/5xx, URLError/timeout/empty choices and http.client.HTTPException (a response body cut mid-read, including IncompleteRead) retry with capped exponential backoff; a cut body is transport, not a fatal outcome"
    retry_after: "Retry-After wins, capped at 120 s"
    context: "a 400 whose body names a context limit appends a forced compact and retries the same turn; four attempts max"
    record: "retry {attempt, code, delay_ms, text} is audited but is not part of the message list"
  output:
    per_turn: "LOOP_TURN_TOKENS=16384 default; a length stop records the truncated turn, never executes it, and retries at wire.max_tokens"
    safety: "eight consecutive length stops end output_limit; that is a runaway guard, not a turn or time cap"
  reasoning: "wire.replay_reasoning=0 sends reasoning_content='' for old assistant turns; the field is required by thinking mode and empty is accepted"
  observations: "read-like commands (cat, sed, head, tail, grep, ls, git diff) keep a contiguous head up to LOOP_READ_INLINE=8192; failures keep stderr_tail"
