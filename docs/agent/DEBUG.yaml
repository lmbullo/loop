schema: loop-agent-doc/1
id: debug
title: Debugging and recovery
read_when: [a command is blocked, a run is stuck, a record is corrupt, verification fails]
source: [docs/agent/MAP.yaml, docs/agent/RECORD.yaml, docs/agent/SERVER.yaml]
verify: the command in the symptom row, then make verify

first_probes:
  rule: start read-only; do not delete state or kill a worker before you know which run owns it
  commands:
    - git status --short
    - python3 scripts/doctor.py
    - python3 run.py server status
    - python3 run.py view --list | tail -10
    - python3 run.py server logs -n 80
    - python3 run.py server runs --json
  notes:
    - server status is read-only even when it exits 1
    - view and server runs work with the daemon stopped because they read record bytes from disk

symptoms:
  - {symptom: "Busy: tree lock held by pid=N; one run per tree", inspect: "server status; .logs/run.lock", action: "wait for the live worker; the daemon reconciles a dead one on the next start/tick; do not delete the lock file"}
  - {symptom: "run ... is held by a live executor", inspect: "server status; .logs/runs/<id>/record.lock", action: "wait or resume later; never append by hand"}
  - {symptom: run has no end, inspect: "python3 run.py view RUN_ID", action: "it is interrupted; use resume if you want to continue; view is enough to inspect"}
  - {symptom: "a turn's cache miss dwarfs the bytes it appended", inspect: "make audit RUN=<id>", action: "prefix_ok=False or a suspected break means the static prefix changed or was reordered; check api.header, the tool schema, call-id/argument canonicalization and the observation renderer; a fixed tail is never cached, so short turns cannot reach a high ratio"}
  - {symptom: "cache audit cannot resolve or read a record", inspect: "python3 run.py view --list; record.jsonl", action: "the audit exits 2 on a missing or corrupt record; use view to confirm bytes, and never hand-repair a complete line"}
  - {symptom: server status exits 1, inspect: "server logs -n 80; registry", action: "python3 run.py server start; the daemon can be down while records are healthy"}
  - {symptom: daemon will not start, inspect: "server logs -n 40; server _stale", action: "run _stale then start; a too-long socket path falls back to $TMPDIR/loop-<hash>.sock; read the registry, do not guess"}
  - {symptom: server stop/restart refused, inspect: "server status; live worker entry", action: "a worker is live; let it finish, or use --force knowing it names and interrupts/detaches the run"}
  - {symptom: a second api seems to ignore my new task, inspect: "server status; queue.json", action: "a second api queues a front item and streams that run; it does not attach to the in-flight run; the tree lock makes it wait"}
  - {symptom: queue stuck on current, inspect: "server status; .logs/queue.json; .logs/workers/", action: "the supervisor promotes after a lost worker (about 6 s tolerance); do not hand-edit queue.json while the daemon runs"}
  - {symptom: worker died, inspect: "workers/<run_id>.json; record state", action: "the daemon reconciles an unlocked record to interrupted; then decide whether to resume"}
  - {symptom: api exits 1, inspect: "record error event finish=harness_error; server logs", action: "an unhandled harness or model exception; read error.text and the worker log, fix the cause, then retry"}
  - {symptom: api exits 3, inspect: "record error event; LOOP_API_KEY/auth file", action: "missing credentials; fix LOOP_API_KEY or LOOP_AUTH_FILE; the failed run still has an inspectable record"}
  - {symptom: api exits 4, inspect: "record error event; server logs", action: "HTTP error; read the recorded body and the model/env settings before retrying"}
  - {symptom: api exits 5, inspect: "server logs; server status", action: "control plane unavailable; fix the daemon, then retry; do not assume the task ran"}
  - {symptom: api exits 130, inspect: "record interrupted event; server logs", action: "the run was cancelled or force-stopped; inspect the record, then decide whether to resume"}
  - {symptom: run ends finish=no_tool_call, inspect: "view RUN_ID; the last turn has no tool_calls and empty content; a nudge event should precede a second turn", action: "after turn 1 the loop nudges once; a second silent stop is terminal; resume the run if the work is still usable"}
  - {symptom: resume exits 5, inspect: "server status; lock holders; live worker", action: "a tree run or the record is held, or the run is live; wait; do not force"}
  - {symptom: resume exits 2, inspect: "view --list; record state", action: "the run is complete, corrupt or the id is wrong; nothing to resume"}
  - {symptom: record is corrupt, inspect: "view RUN_ID; raw lines", action: "never rewrite complete lines; preserve the file, find the first bad seq/field/JSON line and fix the producer/test"}
  - {symptom: "[torn] bytes=N in view", inspect: last line of record.jsonl, action: "a partial trailing line; the next writer truncates it; resume reports it; do not edit earlier lines"}
  - {symptom: large observation is a summary, inspect: call.saved; obs/, action: "grep the saved file for the line you need or read a small range; the summary's note warns that a whole re-read is summarized again; binary observations are a digest only and raw bytes are not recoverable"}
  - {symptom: tests wrote real .logs/, inspect: test code and env, action: "use tests.support.sandbox(); it redirects LOOP_*; do not delete the repo .logs/ to clean up a test"}
  - {symptom: check lines fails, inspect: "python3 run.py check lines", action: "split the module or move behavior to a new module; do not raise the 200-line limit for a source file"}
  - {symptom: "check_manifest.py: unregistered source", inspect: manifest.files, action: "add the file with a kind and role; every .py under harness/, tui/, tests/, scripts/ is checked"}
  - {symptom: "check_manifest.py: bad scenario/check/record", inspect: the manifest row, action: "make argv/expect_exit/network, scenarios[] steps or record types match the tree"}
  - {symptom: drag copy does nothing, inspect: "tui/mouse.py, tui/select.py, tui/clipboard.py, tui/frame.py; terminal OSC 52 support", action: "a click without motion copies nothing; OSC 52 or an installed wl-copy/xclip/xsel/pbcopy helper must accept the text; the reverse-video highlight is screen-only and clears on release"}
  - {symptom: "mobile bridge 401 invalid token", inspect: ".logs/mobile.token; the start line; LOOP_MOBILE_TOKEN", action: "re-enter the printed token; start regenerates only when no token file or env override exists; stop/start with a new file if the token leaked"}
  - {symptom: "mobile bridge connection refused", inspect: "server mobile status; server status; host IP", action: "start the bridge on the Wi-Fi IP with --host, confirm the phone is on the same network, and remember daemon stop/restart closes the listener"}
  - {symptom: "mobile bridge 403/refused to bind", inspect: "server mobile status; --host", action: "bind only a literal private or loopback IP; 0.0.0.0, public, multicast and non-private peers are rejected by design"}
  - {symptom: "mobile app has no roots", inspect: "server mobile status roots=; LOOP_MOBILE_ROOTS or --root", action: "restart the bridge with an existing allowlisted directory; the app never browses outside it"}
  - {symptom: "mobile layout test fails", inspect: "mobile/lib/home.dart, navigation.dart, task_list.dart, activity_view.dart, workspace_view.dart, prompt_box.dart, widgets.dart; mobile/test/layout_test.dart", action: "keep the Gruvbox floating prompt and nav rail above system/keyboard insets, the activity/workspace tabs reachable and task cards scrollable; fix the layout, not the assertion"}
  - {symptom: check tui fails, inspect: "tui/panes.py, tui/nav.py, tui/prompt.py, tui/render.py, tui/logview.py, tui/indicator.py, tui/frame.py, tui/highlight.py", action: "fix fit/reflow/width/free-scroll/scroll-indicator/highlight geometry; do not weaken the audit"}
  - {symptom: sim fails, inspect: ".logs/<sim>/<label>/log.json; obs/; scenario JSON", action: "check the sim field, fixture, step schema, exit behavior and mounted workspace"}
  - {symptom: docs look stale, inspect: "manifest.json, owning module, tests", action: "code wins; update the doc and, if the contract changed, the manifest in the same commit"}

safe_commands:
  - python3 run.py
  - python3 run.py --json
  - python3 run.py view --list
  - python3 run.py view RUN_ID [--json]
  - python3 run.py view --schema
  - python3 run.py server status
  - python3 run.py server list [--json]
  - python3 run.py server runs [--json]
  - python3 run.py server logs -n 80
  - python3 run.py server mobile status
  - python3 run.py probe [SNAPSHOT] [--size WxH] [--focus task|queue|prompt|log] [--qsel N]
  - python3 run.py check lines
  - python3 run.py check tui
  - python3 scripts/check_manifest.py
  - python3 scripts/repo_map.py
  - python3 scripts/doctor.py
  - python3 run.py sim1 task
  - python3 run.py sim2 task2

mutating_or_expensive:
  - {cmd: "run.py api / run.py resume RUN_ID", effect: "network, tokens, record writes"}
  - {cmd: "server start|stop|restart|reload", effect: "process/queue/registry changes"}
  - {cmd: "server list --prune", effect: "removes dead registry entries"}
  - {cmd: "server _stale", effect: "removes dead socket, pid and registry entries"}
  - {cmd: "sim1 / sim2", effect: "rewrite .logs/<sim>/<label>/"}
  - {cmd: make clean, effect: "removes bytecode/caches, never .logs"}
  - {cmd: scripts/verify.py, effect: "its clean check deletes __pycache__; sims write .logs/sim*; without --skip-server it starts/stops the daemon"}

never:
  - run a real api call or resume RUN_ID in offline verification
  - delete .logs/ while a worker is live
  - hand-edit a complete record line
  - rewrite fixtures/, scenarios/ or records/ in place during a run
  - kill a worker pid from a stale registry entry without checking its start fingerprint and the live record lock
  - commit .logs/, __pycache__/, credentials or generated blobs
  - hide a failed tool call instead of recording it as an observation

recovery_order:
  - identify the state with server status, view --list and the worker registry
  - identify the owner with the tree lock, record lock and live pid plus proc_start
  - prefer waiting for a live worker over force-stopping it
  - prefer view or resume over rewriting a record
  - prefer daemon reconcile over hand-editing queue/worker files
  - after recovery run the relevant verification and record the exact command in the commit check line

escalation:
  - {layer: record bytes, read: docs/agent/RECORD.yaml, change: recwrite.py only through Writer}
  - {layer: turn loop, read: docs/agent/WIRE.yaml, change: agent.py, turn.py plus tests}
  - {layer: tools/observations, read: docs/agent/WIRE.yaml, change: tools.py, observe.py plus tests}
  - {layer: daemon/workers, read: docs/agent/SERVER.yaml, change: srv*.py, worker.py, queue.py plus tests}
  - {layer: contract, read: manifest.json, change: scripts/check_manifest.py must pass}
  - {layer: docs, read: docs/agent/, change: manifest.files plus index.yaml}
