schema: loop-agent-doc/1
id: record
title: Record and view
read_when: [inspect a run, change event fields, resume a run, debug a corrupt record]
source: [manifest.record, harness/recschema.py, harness/recread.py, harness/recwrite.py, harness/view.py]
verify: [python3 run.py view --schema, python3 run.py view --list, "python3 -m unittest tests.test_recread tests.test_recwrite tests.test_view"]

paths:
  record: .logs/runs/<run_id>/record.jsonl
  lock: .logs/runs/<run_id>/record.lock
  obs: .logs/runs/<run_id>/obs/
  tree_lock: .logs/run.lock
  rule: one record per run, co-located with its obs/; the tree lock allows one run per tree

run_id:
  pattern: "^[0-9]{8}T[0-9]{6}[0-9]{3}Z-[0-9a-f]{8}$"
  order: lexicographic order equals chronological order; newest is max(run_id)
  resolve: record.resolve() picks the newest when no id is given and rejects unknown ids

line:
  format: one canonical JSON object per line, UTF-8, LF terminated, no embedded newline
  example: '{"schema":"loop-record/1","v":1,"run_id":"20240101T000000000Z-abcdef01","seq":1,"ts":"2024-01-01T00:00:00.000Z","type":"run_start","data":{}}'
  envelope: exactly schema, v, run_id, seq, ts, type, data
  rules:
    - schema == loop-record/1 and v == 1
    - run_id matches the directory
    - seq is contiguous from 1 and never reused
    - data fields are exactly the set declared for the event type
    - unknown envelope or payload fields are corruption, not extensions
    - a final line without LF is a torn tail; the next writer truncates it; complete lines are never modified
  crash_safety: one O_APPEND write of one line then fsync, before the next turn

events:
  - {type: run_start, terminal: false, data: "task str, root str, entrypoint str, model str, tools list<str>, max_inline int, record_source str"}
  - {type: turn, terminal: false, data: "turn int, finish_reason str|null, usage usage, message message, calls list<call>, done done|null"}
  - {type: resume, terminal: false, data: "from_seq int, turn int, messages int, root str, by str"}
  - {type: verify, terminal: false, data: "command str, ran bool, exit int|null, note str|null"}
  - {type: error, terminal: false, data: "code int, text str, finish str"}
  - {type: interrupted, terminal: marker, data: "reason str, last_seq int, by str"}
  - {type: end, terminal: true, data: "exit int, finish str, result str|null, turns int, hit int, miss int, out int, reasoning_c int, cost num"}

types:
  usage: {hit: int, miss: int, out: int, reasoning_c: int, cost: num}
  message: {role: str, content: str|null, tool_calls: "list<tool_call>"}
  tool_call: {id: str, type: str, function: fn}
  fn: {name: str, arguments: str}
  call: {id: str, name: str, observation: str, bytes: int, saved: "str|null"}
  done: {id: str, result: str}

event_notes:
  assistant_content: stored as null in the message; terminal text is kept only in end.result
  done_call: appears on the assistant message but is not appended as a call; turn.done records it and the run ends
  no_tool_call: "empty content -> finish=no_tool_call; non-empty content -> finish=done with result=stripped content"
  resume_event: records from_seq, turn and rebuilt message count; it does not replay old tool calls
  verify_declaration: {ran: false, exit: null, note: null, when: "before the first turn, only when the task carries a command"}
  verify_result: {ran: true, when: "after the terminal turn, before end", ok: "exit == 0", note: "first output line plus ms=<duration>"}
  verify_absent: no verify event means no command was requested; never render it as a pass
  verify_resume: fold.pending_verify returns the last declared command; a ran=true event clears it, so a recorded result is never rerun

state:
  record_state: {empty: no events, interrupted: "last event is not end", complete: "last event is end"}
  terminal_marker: end is the only completion marker; a missing end is the interrupted marker
  interrupted_marker: "an interrupted event records who noticed and why: server_start, server_stop, worker_lost; it is not required for the state"
  kill_9: leaves no marker
  listing_state: "recread.live_state/scan report running when record_state=interrupted and a live worker registry entry holds the run; the record state itself stays interrupted"
  view_text_note: "view RUN_ID renders record state, not listing state; a live run still shows [interrupted] reason=no_terminal_event until end or an interrupted event"

derived_view_lines:
  - "[interrupted] reason=no_terminal_event last_seq=N by=- when the last event is not interrupted and state != complete"
  - "[torn] bytes=N dropped=1 when the reader found a partial trailing line"

fold:
  module: harness/fold.py
  functions:
    - {name: totals_of, effect: "sum turn.usage into hit/miss/out/reasoning_c"}
    - {name: derive, effect: "task, root, turn, obs_n and the last done call"}
    - {name: pending_verify, effect: "last verify.command with ran=false, else null; a ran=true event clears it"}
    - {name: context, effect: "rebuild the request message list"}
  aliases: harness.agent re-exports totals_of, derive and context for callers and tests
  shape: |
    [
      {"role":"system","content":api.header()},
      {"role":"user","content":task},
      for each turn event:
        turn.data.message,
        for each call in turn.data.calls:
          {"role":"tool","tool_call_id":call.id,"content":call.observation}
    ]
  header: regenerated by api.header() from current config on every fold
  max_inline: run_start.max_inline is recorded metadata for audit; it is not substituted into the header
  resume: sees the current header, not necessarily the byte-identical header of the original run

writer:
  class: recwrite.Writer
  steps:
    - validate run_id; create .logs/runs/<run_id>/
    - take record.lock with flock(LOCK_EX|LOCK_NB); raise record.Busy if held
    - read existing events; compute seq; ftruncate a torn tail and fsync
    - "append(type, data): validate against manifest.record, serialize canonical JSON + LF, O_APPEND write, fsync, increment seq"
    - seal() makes later appends raise record.Sealed; close() seals and releases fds
    - interrupt(reason, by) appends one interrupted event only if not sealed and last event is neither end nor interrupted
  crash_safety: one fsynced line per event; a kill loses at most the in-flight turn; end is never inferred

reconcile:
  function: recwrite.reconcile(reason, by, run_id=None)
  steps:
    - skip corrupt records; never rewrite them
    - skip complete records
    - try a Writer; skip a record whose lock is held by a live executor
    - append one interrupted event if the last event is not terminal
  callers: daemon start (server_start) and supervisor for a lost current worker (worker_lost)

view:
  function: pure over record bytes; no server, network, clock or cwd
  commands:
    - python3 run.py view --list
    - python3 run.py view --list --json
    - python3 run.py view RUN_ID
    - python3 run.py view RUN_ID --json
    - "python3 run.py view --json RUN_ID | python3 run.py view -"
    - python3 run.py view --schema
  list_json: '{"schema":"loop-view/1","version":1,"kind":"list","runs":[...]}'
  envelope: exactly schema, version, run_id, source_schema, source_version, state, seq, torn_tail_bytes, events
  stdin_validation: fields, schema/version, every event and the declared state must match
  text_limits: {args: 180, err: 300, obs: 400, task: 200, text: 300}
  escaping: newlines, carriage returns and tabs are escaped in the text form
  exit_codes: {0: rendered, 2: no such run, corrupt record or usage error}

resume:
  command: python3 run.py resume RUN_ID
  cost: tokens and network
  refuses:
    - complete run (last event is end) with exit 2
    - corrupt record with exit 2
    - record whose worker is live with exit 5
    - tree whose .logs/run.lock is held, or a record lock held by another process, with exit 5
  steps:
    - acquire the tree lock
    - open a Writer
    - append one resume event
    - run the same loop and append turn* then end
    - fall back to config.root() if the recorded root is missing; say so on stderr
  scope: resume is not part of the control plane
