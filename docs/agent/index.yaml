schema: loop-agent-docs/2
version: 2
format: yaml
title: Agent docs entry and machine index
entry: docs/agent/index.yaml
contract: manifest.json
rule: code is truth; manifest.json is the machine contract; fix docs and manifest in the same commit

facts:
  runtime: python >=3.8, stdlib only, tested on 3.12
  human_entry: "README.md; public support and policy docs: CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, LICENSE"
  machine_rule: "human-facing prose only in the human layer; AGENTS.md, docs/agent/*.yaml and manifest.json stay machine-first"
  bootstrap: "python3 run.py --json [FIELD] -> one compact loop-index/1 line (or the FIELD subtree) derived from manifest.json; no tree walk, no absolute paths"
  entry: "python3 run.py <command>; modules are import-only"
  root: dirname(run.py), overridable with LOOP_ROOT
  state: "<LOOP_ROOT>/.logs, overridable with LOOP_RUNS"
  record: ".logs/runs/<run_id>/record.jsonl; end is the only completion marker"
  tree_lock: ".logs/run.lock; one run per tree; a second api queues a front item and waits"
  network: api and resume RUN_ID only; both cost real tokens
  tools: [exec, read, write, edit, done]
  request: "model LOOP_MODEL; max_tokens LOOP_MAX_TOKENS (65536, the model ceiling); thinking enabled with LOOP_THINK_BUDGET (32768); the run start snapshots model, tools, system, max_tokens, thinking and renderer into a wire event; authorization from LOOP_API_KEY or LOOP_AUTH_FILE"
  turns: "no turn cap in the run loop: it continues until done, an empty terminal stop after the one silent nudge, or should_stop; a truncated (finish=length) turn is never executed and is retried without a retry limit; tests/test_turn_budget.py runs a 400-turn task"
  verify: "run.py api --verify CMD; declared before the first turn, run after the terminal turn, recorded as verify events before end; view derives ok=1 from exit 0 and ok=0 otherwise"
  inline_limit: "LOOP_MAX_INLINE, default 2048 bytes; run_start.max_inline pins the observation bound for a run; renderer obs/2 emits a compact head/tail/stderr index and same=obs-N for an exact repeat"
  prompt_prefix: "wire.system, wire.tools, wire.model, wire.max_tokens and wire.thinking are snapshotted at run start; task and observation facts are appended later, so the static prefix cannot change mid-run"
  silent_stop: "a turn with no tool call and no text gets one recorded nudge after turn 1; a second silent stop is finish=no_tool_call"
  sim_pricing: "sim1 and sim2 projections call pricing.cost, so cache rates come from manifest.cost_model"
  cache_audit: "python3 scripts/cache_audit.py [RUN_ID] [--json] rebuilds every request prefix from record bytes, asserts it only grows and reports hit/miss/out/cost, reuse references, peak context and suspected cache breaks; offline, no model call"
  call_audit: "python3 scripts/call_audit.py [RUN_ID] [--json] (loop-call-audit/1) reports per-run call names and argument shapes, failure kinds, repeated and refetched reads, and the hit/miss/out/reasoning_c split; offline, no model call"
  read_contract: "read pages one file and prints shown a-b of N plus at most one 'next: read(path=P, start=N|offset=N)'; a printed continuation is run literally instead of re-reading the file"
  bad_args: "arguments that are not one JSON object, or that lack a required field, are answered 'err bad_args <fn> not dispatched: <why>' and never executed with {}; the turn continues"
  binary_obs: binary is a digest; raw bytes are not saved
  schemas: {record: loop-record/1, wire: loop-wire/2, view: loop-view/1}
  install: "sh install.sh -> $HOME/.local/bin/loop; --system -> /usr/local/bin/loop; --uninstall removes the launcher"

docs:
  - {path: docs/agent/MAP.yaml, title: Tree map, read_when: [find the owning module, find an entry point, find who writes state], topics: [entrypoints, execution model, subsystems, write ownership, imports]}
  - {path: docs/agent/RECORD.yaml, title: Record and view, read_when: [inspect a run, change event fields, resume a run, debug corruption], topics: [loop-record/1, events, nudge, state, fold, writer, reconcile, view, resume]}
  - {task: run 400 turns or diagnose a long run, read: [docs/agent/WIRE.yaml, docs/agent/RECORD.yaml, docs/agent/DEBUG.yaml, harness/loop.py, harness/budget.py, harness/memo.py, harness/retry.py]}
  - {path: docs/agent/WIRE.yaml, title: Agent wire, read_when: [change a tool, change observation bounding, change the stop policy, reason about cost], topics: [tools, observations, failures, stop/nudge, verify, request, cost, sim wires, header]}
  - {path: docs/agent/SERVER.yaml, title: Server, queue and workers, read_when: [operate the daemon, queue a task, diagnose a worker, change lifecycle, expose the mobile bridge], topics: [daemon, worker, queue, locks, reconcile, reload, restart, socket, mobile bridge, bearer token, directory allowlist]}
  - {path: docs/agent/WORKFLOWS.yaml, title: Change, test and verification workflows, read_when: [change code, add a test, add a scenario, add a check, commit], topics: [verification ladder, test map, recipes, manifest registration, commit protocol]}
  - {path: docs/agent/DEBUG.yaml, title: Debugging and recovery, read_when: [a command is blocked, a run is stuck, a record is corrupt, verification fails], topics: [probes, symptom matrix, safe commands, recovery order]}

routes:
  - {task: bootstrap, route and enumerate the contract in one call, read: [manifest.json], run: [python3, run.py, --json]}
  - {task: orient a human contributor, read: [README.md, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md], run: [make, verify]}
  - {task: find the owner of a behavior, read: [docs/agent/MAP.yaml], run: [python3, scripts/repo_map.py]}
  - {task: inspect a run without executing, read: [docs/agent/RECORD.yaml], run: [python3, run.py, view, RUN_ID]}
  - {task: audit cache reuse or a suspected cache break, read: [docs/agent/WIRE.yaml, docs/agent/WORKFLOWS.yaml], run: [make, audit]}
  - {task: change a tool or observation rule, read: [docs/agent/WIRE.yaml, docs/agent/WORKFLOWS.yaml], run: [python3, run.py, sim1, edge]}
  - {task: change the read tool, its numbered ranges or the next: continuation, read: [docs/agent/WIRE.yaml, docs/agent/MAP.yaml], run: [python3, -m, unittest, tests.test_read]}
  - {task: change shell classification or exec argv/cmd handling, read: [docs/agent/WIRE.yaml, docs/agent/MAP.yaml], run: [python3, -m, unittest, tests.test_cmds]}
  - {task: change multi-hunk edit semantics or match diagnostics, read: [docs/agent/WIRE.yaml, docs/agent/MAP.yaml], run: [python3, -m, unittest, tests.test_edits]}
  - {task: audit tool call shapes, failures or refetched reads, read: [docs/agent/WIRE.yaml, docs/agent/DEBUG.yaml], run: [python3, scripts/call_audit.py, RUN_ID, --json]}
  - {task: change the terminal or nudge stop policy, read: [docs/agent/WIRE.yaml, docs/agent/RECORD.yaml], run: [python3, -m, unittest, tests.test_agent_loop]}
  - {task: add or change a post-run verify command, read: [docs/agent/WIRE.yaml, docs/agent/RECORD.yaml], run: [python3, -m, unittest, tests.test_verify]}
  - {task: operate or debug the control plane, read: [docs/agent/SERVER.yaml, docs/agent/DEBUG.yaml], run: [python3, run.py, server, status]}
  - {task: run the mobile bridge or build the Android app, read: [docs/agent/SERVER.yaml, mobile/README.md], run: [python3, run.py, server, mobile, status]}
  - {task: change mobile workspace discovery, routing, aggregation or daemon start, read: [docs/agent/SERVER.yaml, docs/agent/MAP.yaml, mobile/README.md], run: [python3, -m, unittest, tests.test_mobile_workspaces]}
  - {task: change the mobile task list, activity timeline or floating composer, read: [docs/agent/MAP.yaml, docs/agent/WORKFLOWS.yaml, mobile/README.md], run: [sh, -c, "cd mobile && flutter analyze --no-pub && flutter test --no-pub"]}
  - {task: change the mobile connection form, directory picker, workspace view or run detail, read: [docs/agent/MAP.yaml, docs/agent/WORKFLOWS.yaml, mobile/README.md], run: [sh, -c, "cd mobile && flutter analyze --no-pub && flutter test --no-pub"]}
  - {task: change the mobile Gruvbox theme, floating nav or shared chrome, read: [docs/agent/MAP.yaml, mobile/README.md], run: [sh, -c, "cd mobile && flutter analyze --no-pub && flutter test --no-pub"]}
  - {task: render a snapshot headlessly, read: [docs/agent/MAP.yaml, docs/agent/WORKFLOWS.yaml], run: [python3, run.py, probe]}
  - {task: see a run's tool calls in the tui, read: [docs/agent/MAP.yaml], run: [python3, run.py, tui]}
  - {task: read a run's full final summary in the tui, read: [docs/agent/MAP.yaml], run: [python3, run.py, tui]}
  - {task: scroll a run log or task history with the wheel and read the scroll indicator, read: [docs/agent/MAP.yaml, docs/agent/WORKFLOWS.yaml], run: [python3, run.py, tui]}
  - {task: change tui redraw or live-log tailing, read: [docs/agent/MAP.yaml, docs/agent/WORKFLOWS.yaml], run: [python3, run.py, check, tui]}
  - {task: copy text from the tui, read: [docs/agent/MAP.yaml], run: [python3, run.py, tui]}
  - {task: cancel the selected task in the tui, read: [docs/agent/MAP.yaml, docs/agent/SERVER.yaml], run: [python3, run.py, tui]}
  - {task: add a test or scenario, read: [docs/agent/WORKFLOWS.yaml], run: [make, test]}
  - {task: install the loop command for users, read: [README.md, AGENTS.md], run: [sh, install.sh]}
  - {task: verify before commit, read: [docs/agent/WORKFLOWS.yaml], run: [make, verify]}
  - {task: commit a change, read: [AGENTS.md, docs/agent/WORKFLOWS.yaml], run: [python3, scripts/commit_check.py, --range, HEAD~1..HEAD]}

commands:
  offline:
    - [sh, install.sh, --help]
    - [sh, install.sh, --dry-run]
    - [python3, run.py]
    - [python3, run.py, --json]
    - [make, index]
    - [python3, run.py, check, lines]
    - [python3, run.py, check, tui]
    - [python3, run.py, view, --list]
    - [python3, run.py, view, --list, --json]
    - [python3, run.py, view, RUN_ID]
    - [python3, run.py, view, RUN_ID, --json]
    - [python3, run.py, view, --schema]
    - [python3, run.py, resume]
    - [python3, run.py, sim1, task]
    - [python3, run.py, sim2, task2]
    - [python3, run.py, probe]
    - [python3, run.py, tui]
    - [python3, run.py, server, start]
    - [python3, run.py, server, stop]
    - [python3, run.py, server, restart]
    - [python3, run.py, server, reload]
    - [python3, run.py, server, status]
    - [python3, run.py, server, list, --json]
    - [python3, run.py, server, runs, --json]
    - [python3, run.py, server, logs, -n, 80]
    - [python3, run.py, server, mobile, start]
    - [python3, run.py, server, mobile, status]
    - [python3, run.py, server, mobile, stop]
    - [make, check]
    - [make, test]
    - [make, lint]
    - [make, sim]
    - [make, verify]
    - [make, audit]
    - [make, output]
    - [make, clean]
    - [python3, scripts/check_manifest.py]
    - [python3, scripts/doctor.py]
    - [python3, scripts/repo_map.py]
    - [python3, scripts/cache_audit.py, RUN_ID]
    - [python3, scripts/cache_audit.py, RUN_ID, --json]
    - [python3, scripts/output_audit.py, RUN_ID]
    - [python3, scripts/output_audit.py, RUN_ID, --json]
    - [python3, scripts/call_audit.py, RUN_ID]
    - [python3, scripts/call_audit.py, RUN_ID, --json]
    - [python3, scripts/verify.py, --list]
  network_and_cost:
    - [python3, run.py, api, TASK]
    - [python3, run.py, api, --verify, CMD, TASK]
    - [python3, run.py, resume, RUN_ID]
  never_in_offline_verification: [api, "resume RUN_ID"]
  offline_usage_check: "resume with no RUN_ID exits 2 after printing usage; the resume-usage manifest check covers it"
  skip_server_filter: any argv token exactly server or api, including tokens inside sh -c strings

paths:
  entrypoint: run.py
  human_entry: README.md
  human_policy: [LICENSE, CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md]
  installer: install.sh
  user_command: "$HOME/.local/bin/loop"
  system_command: /usr/local/bin/loop
  source: harness/
  tui: tui/
  tests: tests/
  scripts: scripts/
  docs: docs/agent/
  contract: manifest.json
  sandbox_root: dirname(run.py), overridable by LOOP_ROOT
  runtime_state: "<LOOP_ROOT>/.logs, overridable by LOOP_RUNS"
  records: .logs/runs/<run_id>/record.jsonl
  record_lock: .logs/runs/<run_id>/record.lock
  observations: .logs/runs/<run_id>/obs/
  tree_lock: .logs/run.lock
  queue: .logs/queue.json
  jobs: .logs/jobs/<run_id>.json
  workers: .logs/workers/<run_id>.json
  reload: .logs/reload.json
  mobile_token: .logs/mobile.token (mode 0600)
  mobile: mobile/ (Android-first Flutter client; Gruvbox dark surfaces, floating prompt and nav rail over tasks/activity/workspace tabs)
  socket: .logs/server.sock, or $TMPDIR/loop-<sha256(state_dir)[:16]>.sock when >100 bytes
  server_log: .logs/server.log
  server_pid: .logs/server.pid
  server_lock: .logs/server.lock
  queue_lock: .logs/queue.json.lock
  workers_lock: .logs/workers.lock
  registry_lock: .logs/registry.json.lock
  local_registry: .logs/registry.json
  global_registry: "$LOOP_REGISTRY or $XDG_STATE_HOME/loop/registry.json or ~/.local/state/loop/registry.json"
  scenarios: scenarios/ (read-only input)
  fixtures: fixtures/ (read-only input; copied into .logs/<sim>/<label>/ws/ per sim run)
  frozen_records: records/ (read-only history)

exit_codes:
  api: {0: finished, 1: harness error, 2: usage error, 3: no credentials, 4: api error, 5: server unavailable, 130: interrupted by cancel or server stop}
  server: {0: ok, 1: "status down; runs corrupt record; logs follow error; restart --all target failure", 2: usage error, 5: start failure or guard refusal}
  view: {0: rendered, 2: no such run, corrupt record, or usage error}
  resume: {0: finished, 1: harness error, 2: refused or usage error, 3: no credentials, 4: api error, 5: tree/record busy or live worker}
  check: {0: audit passed, 1: audit failed, 2: usage error}
  install.sh: {0: "installed, removed or already absent", 2: "usage error, foreign file, missing checkout or unwritable bindir"}
  sim1: {0: ran, 2: usage or unknown scenario}
  sim2: {0: ran, 2: usage or unknown scenario}
  tui: {0: quit, 2: usage error or no tty}
  probe: {0: rendered, 2: usage error, bad json, or not a snapshot}

record:
  schema: loop-record/1
  view_schema: loop-view/1
  id_pattern: "^[0-9]{8}T[0-9]{6}[0-9]{3}Z-[0-9a-f]{8}$"
  events: [run_start, wire, turn, nudge, verify, resume, error, interrupted, end]
  terminal_marker: end
  state:
    empty: no events; resumable, resume appends the first resume event
    complete: last event is end
    interrupted: last event is not end
    listing: running when state=interrupted and a live worker registry entry holds the run
  no_tool_call: "non-empty terminal content ends done with that text as end.result; empty content on turn 1 or after one nudge ends no_tool_call; empty content after turn 1 with no nudge records one nudge user message and continues"

invariants:
  - message list append-only
  - record append-only; one fsynced line per event
  - end is the only completion marker
  - observations verbatim except the bounding rule; an exact repeat becomes same=obs-N
  - the wire snapshot is the static prefix; run-specific values enter after it
  - a silent stop after turn 1 gets one nudge; a second silent stop is no_tool_call
  - "verify is evidence, not a gate: the event stores exit and view derives ok"
  - output metered, never gated
  - fixtures and records are read-only
  - no absolute paths in tracked files
  - run.py is the only entry point
  - one run per tree via .logs/run.lock
  - the daemon never executes a run; workers survive daemon restart
  - server code never imports tui/
  - the mobile bridge is opt-in, binds one private, loopback or Tailscale IP, and requires a bearer token

traps:
  - a second api queues a front item and streams that run; it does not attach to the in-flight run
  - server restart is not a run restart; use resume
  - binary observations are digest-only; raw bytes are not saved
  - run_start.max_inline pins the observation bound; resume and soft reload reuse it
  - wire.system is a snapshot, not a live read; do not put run-specific values in the system prefix
  - reasoning_content must be present on a replayed assistant message when thinking is enabled; fold defaults old records to ""
  - LOOP_RUNS selects the daemon state dir; keep it stable per tree
  - do not delete .logs while a worker is live
  - do not rewrite complete record lines
  - never bind the mobile bridge to 0.0.0.0 or a public address; the app is local Wi-Fi only
  - write accepts content as an alias for data; the observation says so
  - terminal assistant text is kept only as end.result; it is never re-sent
  - a nudge is recorded at most once per run; a second silent stop is terminal
  - docs are YAML and are not size-audited, but every doc must be registered in manifest.files

format:
  schema: loop-agent-doc/1
  ext: .yaml
  roots: AGENTS.md and README.md are machine-first Markdown entry points; docs/agent/* are YAML
  style: dense keys, facts not prose, prefer manifest references over duplicated contract values
  add_doc:
    - create docs/agent/NAME.yaml with schema, id, title, read_when, source, verify
    - register manifest.files[] with kind=doc and a role
    - add the route to this file
    - run make verify and python3 scripts/commit_check.py
