schema: loop-agent-doc/1
id: server
title: Server, queue and workers
read_when: [operate the control plane, queue a task, diagnose a worker, change lifecycle]
source: [manifest.server, harness/server.py, harness/srvcmd.py, harness/srvdaemon.py, harness/srvwork.py, harness/srvconn.py, harness/srvclient.py, harness/srvrun.py, harness/srvsnap.py, harness/srvlist.py, harness/srvwire.py, harness/srvctl.py, harness/mobile.py, harness/mobserve.py, harness/mobapi.py, harness/mobtoken.py, harness/worker.py, harness/workers.py, harness/queue.py, harness/job.py, harness/registry.py, harness/regstore.py, harness/regprobe.py]
verify: [python3 run.py server status, python3 run.py server runs --json, "python3 -m unittest tests.test_queue tests.test_workers tests.test_regstore tests.test_mobile_api tests.test_mobile_http"]

process_model: |
  one tree  = realpath of LOOP_ROOT (default: the checkout)
  one daemon per tree (control plane, never executes a model turn)
  one run per tree (tree lock)
  one detached worker per run (executes the loop, holds the run lock)

  client (run.py api) -> server.sock -> daemon -> queue/job -> worker
  worker -> record.jsonl <- daemon/client read from disk

ownership:
  daemon: queue and on-disk worker registry
  daemon_run: none; killing or restarting it cannot interrupt a live worker
  durable_truth: the worker's record; the daemon answers from .logs when its memory is empty

commands:
  list:
    - {cmd: start, usage: "", effect: "probe, clean stale, spawn one daemon, wait ready; idempotent", exit: "0 ok, 5 start failure"}
    - {cmd: stop, usage: "[--force]", effect: "stop this tree's daemon; refuse a live worker unless --force", exit: "0 ok, 2 usage, 5 guard/refusal"}
    - {cmd: restart, usage: "[--all] [--force]", effect: "replace the daemon; detached workers survive; --all walks the machine registry", exit: "0 ok, 1 restart --all target failure, 5 guard/refusal"}
    - {cmd: reload, usage: "", effect: "bump .logs/reload.json; workers apply at the next turn boundary", exit: "0"}
    - {cmd: status, usage: "", effect: "answer from .logs and the live daemon; print one flat line", exit: "0 running, 1 down"}
    - {cmd: list, usage: "[--json] [--prune]", effect: "probe every server in the machine registry; --prune removes dead rows", exit: "0"}
    - {cmd: runs, usage: "[--json]", effect: "every record with derived state; daemon if available, else disk", exit: "0 ok, 1 corrupt record"}
    - {cmd: logs, usage: "[-n N] [-f]", effect: "tail .logs/server.log; -f follows", exit: "0, 1 follow error"}
    - {cmd: mobile, usage: "<start|status|stop> [--host IP] [--port N] [--root DIR ...]; status also takes --json", effect: "manage the opt-in local-network HTTP bridge; start defaults to LOOP_MOBILE_ROOTS or LOOP_ROOT and prints addr plus the token", exit: "0 ok/stopped, 1 status down, 2 usage, 5 daemon or bind failure"}
    - {cmd: _stale, usage: "", effect: "remove dead socket/pid/registry entries", exit: "0"}
  internal:
    - "_daemon: used by srvctl"
    - "_worker: used by srvwork"
  force_rule: stop and restart refuse while a worker is live unless --force; force first prints the run id, worker pid and task; stop --force interrupts workers (SIGTERM, then SIGKILL after 3 s); restart --force detaches the control plane and leaves workers running

state_files:
  list:
    - {path: .logs/server.sock, owner: daemon, meaning: "Unix socket, mode 0600"}
    - {path: .logs/server.pid, owner: daemon, meaning: live daemon pid}
    - {path: .logs/server.log, owner: daemon/workers, meaning: append-only operational log}
    - {path: .logs/server.lock, owner: srvctl, meaning: serializes daemon starts}
    - {path: .logs/registry.json, owner: daemon/srvctl, meaning: tree-local registry mirror}
    - {path: "$LOOP_REGISTRY", owner: regstore, meaning: machine-wide registry, keyed by realpath(tree)}
    - {path: .logs/queue.json, owner: daemon, meaning: current item plus waiting items}
    - {path: .logs/jobs/<run_id>.json, owner: daemon, meaning: task/root/env/verify payload for one worker}
    - {path: .logs/workers/<run_id>.json, owner: worker/daemon, meaning: run_id, pid, proc_start, state, item_id, task, root, seq, turns, cost, exit}
    - {path: .logs/reload.json, owner: "reload.bump (CLI or socket)", meaning: soft-reload generation}
    - {path: .logs/mobile.token, owner: "server mobile start", meaning: "bearer token for the opt-in mobile bridge; mode 0600; LOOP_MOBILE_TOKEN overrides"}
    - {path: .logs/run.lock, owner: worker/resume, meaning: one run per tree}
    - {path: .logs/runs/<run_id>/record.lock, owner: worker/resume, meaning: one executor per record}
    - {path: .logs/runs/<run_id>/record.jsonl, owner: worker/resume, meaning: durable run record}
    - {path: .logs/runs/<run_id>/obs/, owner: worker/resume, meaning: saved large observations}
  socket_fallback: "if the socket path exceeds 100 bytes, use $TMPDIR/loop-<sha256(state_dir)[:16]>.sock and record it in the registry; read the registry, never guess"
  LOOP_RUNS: selects the state directory; use one value per tree while a daemon is live

queue:
  path: .logs/queue.json
  schema: loop-queue/1
  empty: '{"schema":"loop-queue/1","seq":0,"current":null,"items":[]}'
  item_fields: [id, run_id, task, root, env, verify, state, created_at, created_ts, worker_pid, started_at, launched_ts, finished_at]
  item_id: q000001, monotonic
  ops:
    - queue.add() allocates the next id and a new run id
    - queue.promote() moves the first waiting item to current and sets state=running, started_at
    - queue.update() patches current or a waiting item by id
    - queue.finish(state, **fields) closes current with finished_at
    - queue.drop(id) removes a waiting item
    - queue.move(id, delta) swaps with a clamped neighbor
    - "cancel drops a waiting item by id, else interrupts the live worker whose run_id matches; it never removes current, so worker exit and supervisor reconcile close it as interrupted"
    - all mutations take .logs/queue.json.lock
  supervisor_tick: 0.25 s
  supervisor_steps:
    - reap finished child processes
    - read live worker registry entries
    - if current exists and its worker is live, sync worker_pid and return
    - if current is still queued and has no launched_ts, launch it
    - within 6 seconds of launch, tolerate missing or running record state
    - if the record is still missing, finish the item as failed
    - if the record is not complete, reconcile it as worker_lost and finish with the resulting complete/interrupted state
    - if no current, promote one waiting item and launch it
  launch: writes the job, marks the item running with launched_ts, spawns "run.py server _worker <run_id>" in a new session, records the child pid and updates worker_pid
  restart: reattaches from queue.json and workers/; no in-memory state is required

worker_lifecycle:
  steps:
    - load .logs/jobs/<run_id>.json; missing job exits 2
    - acquire .logs/run.lock; busy exits 5
    - open recwrite.Writer(run_id); write workers/<run_id>.json with pid, /proc start fingerprint, state running, item_id, task, root, started_at, started_ts, seq, turns, cost
    - install SIGTERM/SIGINT handlers; a stop request appends interrupted (reason=server_stop, by=server), marks the worker interrupted with exit 130, releases locks, removes the job and exits 130
    - apply only srvwire.ENV_KEYS from the job payload, then run agent.run_task()
    - on normal completion update the worker entry to done or interrupted, close the record, release the tree lock and remove the job
  liveness: live pid plus matching /proc start fingerprint, not a pid alone; workers.live() requires state == running
  dead_entry: a dead worker whose registry entry is still running is left for the supervisor to reconcile; it is not silently deleted

locks:
  list:
    - {lock: .logs/run.lock, holder: worker or resume, consequence: "second run refused; a second api queues a front item"}
    - {lock: .logs/runs/<id>/record.lock, holder: recwrite.Writer, consequence: another executor cannot append}
    - {lock: .logs/server.lock, holder: srvctl.start, consequence: start serialized}
    - {lock: .logs/queue.json.lock, holder: queue mutation, consequence: queue reads/writes serialized}
    - {lock: .logs/workers.lock, holder: worker registry mutation, consequence: registry writes serialized}
    - {lock: .logs/registry.json.lock, holder: registry mutation, consequence: atomic registry writes}
  resumable: a record without end and a free record.lock is interrupted and resumable; a record with a held lock is live and left alone

reconcile:
  start: "recwrite.reconcile(server_start, server) scans every record; corrupt skip, complete skip, lock held skip, otherwise append one interrupted event if the last event is not terminal"
  supervisor: repeats for a lost current worker with reason worker_lost
  never: delete records or infer end

reload_restart:
  reload: "increments reload.json.generation; at the top of each turn reload.maybe() re-imports harness.config, harness.api, harness.observe, harness.tools and harness.pricing; the run's recorded wire snapshot pins the system header, tool schema, model, think budget and max_tokens, and run_start.max_inline pins the observation bound, so the replay prefix stays stable; new runs pick up edited text; no process restart and no interruption of the in-flight turn"
  restart: "shuts down the daemon with the shutdown command and starts a new one; workers survive; the new daemon reads worker entries and reports the live run; clients reconnect with attach and from_seq"
  stop: "stops the daemon; without --force it refuses while a worker is live; restart --force only detaches the control plane, it does not kill the worker"

socket_protocol:
  framing: one JSON request line in, one or more JSON lines out
  inbound: [ping, status, snapshot, runs, enqueue, drop, move, cancel, reload, stop, shutdown, run, attach]
  run: "always adds a front-of-queue item and streams it; a second api queues a new task behind the live run, it does not attach to it"
  attach: stream a known run_id from from_seq
  stop: refuses live workers unless force; with force interrupts them and stops the daemon
  shutdown: stops the daemon and leaves workers running
  cancel: "drops a waiting id, else interrupts the live worker named by run_id (or id as a fallback); reply k=cancelled with kind=queued|running|null, changed=true|false, and the resolved id/run_id/pid when known"
  tui_surface: enqueue, drop, move, cancel
  stream: "run/attach first send hello, then record events from disk; streaming stops at end or interrupted; the client reconnects after a daemon restart and resumes from the last seen seq"
  snapshot: "daemon, current, last, done, queue, costs, tree, waiting, workers_live, version, reconciled; done is a bounded newest-first list of terminal runs (current excluded)"
  fallback: when the daemon is down or old and omits done, the TUI calls srvsnap.local_done() to derive the same list from record bytes, skipping live runs

mobile_bridge:
  purpose: "Android-first app can choose an allowlisted directory, enqueue through the queue, read snapshots and poll one run's projected log"
  process: "a thread inside the daemon; it is not a second control plane and it never executes a run"
  bind: "one literal private or loopback IP; 0.0.0.0, unspecified, multicast and public addresses are refused; non-private peers get 403"
  auth: "every /v1 request needs Authorization: Bearer <token>; token = LOOP_MOBILE_TOKEN or .logs/mobile.token mode 0600; compare is constant-time"
  roots: "LOOP_MOBILE_ROOTS (os.pathsep) or repeated --root; normalize to realpath and reject any path outside the allowlist; omit hidden dirs and symlinks that escape"
  routes:
    - {method: GET, path: "/v1/health", result: "tree, pid, roots"}
    - {method: GET, path: "/v1/dirs?path=", result: "roots plus allowlisted child directories; absent path lists roots only"}
    - {method: GET, path: "/v1/snapshot", result: "srvsnap.snapshot plus schema and mobile roots"}
    - {method: GET, path: "/v1/runs", result: "recread.scan rows"}
    - {method: GET, path: "/v1/runs/<run_id>", result: "runlog.load: tool calls plus full final summary, interruption, error or pending tail"}
    - {method: POST, path: "/v1/tasks", body: "{task,root}", result: "queue.add at the back; returns the queue item"}
  limits: "task <= 20000 chars; body <= 64 KiB; one directory listing <= 500 children"
  lifecycle: "server mobile start|status|stop; daemon stop/restart closes the listener; workers are unaffected; the app holds no authoritative state"
  client: "the Flutter app stores the last successful host, port and token with shared_preferences and auto-connects on launch; failed auto-connect keeps the form populated; no queue or run state is stored"

env_to_worker:
  keys: [LOOP_API_KEY, LOOP_AUTH_FILE, LOOP_MODEL, LOOP_URL, LOOP_MAX_TOKENS, LOOP_THINK_BUDGET, LOOP_MAX_INLINE, LOOP_HTTP_TIMEOUT_S, LOOP_ROOT]
  rule: the worker removes any of these keys not present in the job payload; LOOP_RUNS and LOOP_REGISTRY are daemon process settings, not per-run settings

status:
  format: one flat key=value line
  up_fields: [tree, pid, state, addr, started, log, detail, runs_on_disk, runs_interrupted, latest_run, queue_waiting, workers_live, in_flight, run_state, reconciled]
  down: "prints state=down pid=0 addr=- ... and exits 1"
  run_state: running when a live worker exists; complete when the daemon's current run summary is complete; otherwise -
  interrupted_count: every record whose listing state is interrupted or running; corrupt rows are excluded

guards:
  - one run per tree is enforced by .logs/run.lock in the worker and resume, not by the daemon
  - the daemon never executes a model turn; do not add model code to server modules
  - server modules must never import tui/
  - do not delete .logs/ while a worker is live; that destroys the run record
  - server restart is not a run restart; use resume for an interrupted run
  - a stopped daemon does not stop workers; check server status or workers.live_entries()
  - server status exits 1 when the daemon is down even if records are healthy; view and server runs still work
  - the mobile bridge is opt-in and local-only: never bind 0.0.0.0 or a public address, never accept a non-private peer, never omit the bearer check
  - the mobile app must not own a queue, run id or log row; it renders only responses from the daemon
