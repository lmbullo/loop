schema: loop-agent-doc/1
id: workflows
title: Change, test and verification workflows
read_when: [change code, add a test, add a scenario, add a check, add a doc, commit]
source: [AGENTS.md, manifest.files, manifest.checks, Makefile, .github/workflows/ci.yml, CONTRIBUTING.md]
verify: [make verify, python3 scripts/check_manifest.py, "python3 scripts/commit_check.py --range HEAD~1..HEAD"]

ladder:
  rule: run from the tree root; stop at the first failure
  steps:
    - {n: 0, cmd: "python3 run.py --json", catches: "contract bootstrap: entrypoints, checks, scenarios, docs, invariants, env, layout, record, wire"}
    - {n: 1, cmd: "python3 -m compileall -q harness tui run.py", catches: syntax/import block}
    - {n: 2, cmd: "python3 run.py check lines", catches: "code source over 200 lines or missing"}
    - {n: 3, cmd: "python3 run.py check tui", catches: "fit, one-line call rows, wrapped final summary, log window height, task/queue/log free-scroll clamping, scroll indicator visibility/position, prompt reflow, status width"}
    - {n: 4, cmd: "python3 -m unittest discover -s tests -t .", catches: logic and CLI contracts}
    - {n: 5, cmd: "python3 scripts/check_manifest.py", catches: unregistered files, bad entries/record/checks/scenarios}
    - {n: 6, cmd: "python3 scripts/verify.py --skip-server", catches: all offline manifest checks}
    - {n: 7, cmd: "python3 run.py server status", catches: only when a control plane is expected}
    - {n: 8, cmd: "git status --short", catches: unintended files}

shortcuts:
  - {cmd: "sh install.sh", effect: "install loop for the current user (~/.local/bin); --system for /usr/local/bin; --uninstall removes it"}
  - {cmd: "python3 run.py --json", effect: "one-call agent index (loop-index/1)"}
  - {cmd: make index, effect: "alias for python3 run.py --json"}
  - {cmd: make check, effect: "compile + line + tui"}
  - {cmd: make test, effect: "stdlib unittest, verbose"}
  - {cmd: make lint, effect: "ruff E4/E9/F when installed; skips otherwise"}
  - {cmd: make verify, effect: "scripts/verify.py --skip-server"}
  - {cmd: "make audit RUN=<id>", effect: "offline cache audit for one record; RUN defaults to the newest"}
  - {cmd: "make output RUN=<id>", effect: "offline completion split for one record; RUN defaults to the newest"}
  - {cmd: "python3 scripts/cache_audit.py [RUN_ID] [--json]", effect: "prefix growth, hit/miss/out/cost, reuse references and suspected cache breaks; no model call"}
  - {cmd: "python3 scripts/output_audit.py [RUN_ID] [--json] [--top N]", effect: "completion split into reasoning, tool arguments and result; top-output turns and length truncations; no model call"}
  - {cmd: make sim, effect: "sim1 task + sim2 task2"}
  - {cmd: make clean, effect: "bytecode and tool caches; never .logs"}
  - {cmd: "python3 scripts/verify.py --list", effect: list selected checks}
  - {cmd: "python3 scripts/verify.py --only sim1-task", effect: one check}
  - {cmd: "python3 scripts/verify.py --json", effect: machine summary}

verify_selection:
  network: scripts/verify.py never selects network true checks
  skip_server: "--skip-server skips any check whose argv contains a token exactly equal to server or api, including tokens inside sh -c strings; this covers server-start, server-list, server-status, server-stop, server-runs and api-auth-guard"
  offline_absent: a real api call and a real resume RUN_ID are absent from the offline ladder; they need credentials, network and real tokens; the safe resume-usage check only exercises the exit-2 usage path

test_map:
  - {test: test_config.py, contract: root/run resolution, env parsing, display paths}
  - {test: test_record.py, contract: run id format/order, canonical JSON, discovery, resolve errors}
  - {test: test_recschema.py, contract: envelope strictness, payload fields, declared types}
  - {test: test_recread.py, contract: parse, torn tail, derived state, scan rows, corruption, live listing state}
  - {test: test_recwrite.py, contract: append/fsync, per-run and tree locks, seal, reconcile, torn-tail repair}
  - {test: test_view.py, contract: text render, derived markers, loop-view/1 round-trip, list rows}
  - {test: test_pricing.py, contract: manifest rates and the cost formula}
  - {test: test_observe.py, contract: binary detection, three bounding rules, the 2048-byte default bound, budget-filling head/tail/stderr shape, executable next continuation, saved bytes, exact-repeat same=obs-N ledger}
  - {test: test_bound.py, contract: line-range and tail -c observation continuations, utf8-safe clipping}
  - {test: test_audit.py, contract: "offline cache audit projection: prefix growth, reuse references, wire sha"}
  - {test: test_output_audit.py, contract: "offline output audit: reasoning/argument/result split, top turns and truncations"}
  - {test: test_call_audit.py, contract: "offline call audit: call names and shapes, fail kinds, repeats and refetches, hit/miss/out/reasoning_c split, json mode"}
  - {test: test_cmds.py, contract: "shell classification: read-like argv, compound segment splitting, shell_syntax fix messages"}
  - {test: test_read.py, contract: "read tool: numbered ranges and clamping, find+ctx merging, offset paging, executable next: continuations"}
  - {test: test_edits.py, contract: "multi-hunk edit: all-or-nothing apply, hunk failure report, replace_all opt-in, CRLF hint"}
  - {test: test_bad_args.py, contract: "unparseable or non-object arguments answered err bad_args and never dispatched with {}"}
  - {test: test_length_nudge.py, contract: "loop integration: one length-specific nudge after a truncated reply"}
  - {test: test_turn_budget.py, contract: "no turn or attach cap: a 400-turn task runs to done and srvclient.stream defaults to no total budget"}
  - {test: test_spawn.py, contract: literal argv, cwd/stdin, timeout, OSError, empty argv}
  - {test: test_tools.py, contract: write/append/content alias/edit uniqueness, exec sandbox cwd}
  - {test: test_assets.py, contract: scenario load/defaults, sim ownership, fixture mounting}
  - {test: test_queue.py, contract: add/promote/update/finish/drop/move, corrupt reset}
  - {test: test_regstore.py, contract: atomic registry writes, locking, current-entry precedence}
  - {test: test_workers.py, contract: worker registry, pid+start liveness, reap, record state}
  - {test: test_agent_context.py, contract: usage totals, derive, recorded wire prefix, canonical short ids and compact args, context fold with reasoning_content, response parsing, dispatch, finish, terminal text}
  - {test: test_agent_loop.py, contract: offline run loop with a wire event, one nudge after a silent stop, second silent stop ends no_tool_call, non-str done result is an observation}
  - {test: test_verify.py, contract: pending verify fold, sh -c exit/evidence/root, declaration and settle order, resume command, --verify argv, view lines}
  - {test: test_install.py, contract: "installer help, dry run, user default, prefix with spaces, idempotent install, uninstall, foreign-file refusal, checkout guard"}
  - {test: test_manifest.py, contract: contract integrity, entry imports, record/scenario checks, CLI wiring, --skip-server token filtering}
  - {test: test_checks.py, contract: audited kinds, line-limit failure, TUI contract}
  - {test: test_mobile_api.py, contract: mobile root allowlist, symlink containment, enqueue through queue, run log ids and routing}
  - {test: test_mobile_http.py, contract: bearer auth, private bind and peer filter, dirs/snapshot/queue/run-log routes, token file mode}
  - {test: test_mobile_workspaces.py, contract: "mobile workspace tests: discovery, stale registry, isolation, aggregation, routing, offline fallback and safe start"}
  - {test: mobile/test/api_test.dart, contract: private-host guard, JSON mapping, bearer header and HTTP error mapping}
  - {test: mobile/test/store_test.dart, contract: saved settings, connect, root selection, submit, run watch, failure, disconnect}
  - {test: mobile/test/session_test.dart, contract: load, save, clear and incomplete saved connection settings}
  - {test: mobile/test/widget_test.dart, contract: connect, floating nav activity switch, directory pick, composer submit, live log/summary, connection failure}
  - {test: mobile/test/layout_test.dart, contract: Gruvbox palette, floating rounded prompt and nav with safe/keyboard insets, activity timeline, task-card hierarchy and overflow}
  - {test: test_tui_layout.py, contract: fit, selection marker, state glyphs, one-line task rows, prompt reflow/editing, exact status width, theme palette}
  - {test: test_tui_input.py, contract: arrow selection across running/queued/done, pane handoff, queued-row notice, shift+arrow reorder, delete drop, ctrl+x cancel, text prompt, SS3 arrows}
  - {test: test_tui_keys.py, contract: "raw parser: SS3 arrows, CSI/shifted arrows, ctrl+x, SGR and X10 wheel, left-button mouse events"}
  - {test: test_srv_cancel.py, contract: cancel drops a waiting item, signals the matching live run, resolves promoted item id, id-as-run-id fallback, no change for unknown}
  - {test: test_tui_cancel.py, contract: ctrl+x on running/queued/done, queue-focus cancel, prompt focus ignored, queue clamp}
  - {test: test_tui_history.py, contract: flat task selection map, selection window, task-focus selection, done scroll/range header}
  - {test: test_tui_taskscroll.py, contract: "task-view wheel scrolling: done and queue viewports move without moving selection, clamp at both ends and after resize/content changes, stay unscrolled when content fits, and re-anchor on selection keys"}
  - {test: test_tui_indicator.py, contract: no bar when rows fit, one-cell track/thumb for overflow, movable/clamped thumb, reserved content cell, task and log rendering, resize/content changes}
  - {test: test_tui_logs.py, contract: "log projection (calls + full final summary), one-line call rows, height-sized log window"}
  - {test: test_tui_summary.py, contract: wrapped final summary paragraphs, fitted rows, first-row anchoring, free-scroll to the last row}
  - {test: test_tui_loginput.py, contract: enter opens/closes the log, selection/free-scroll keys, refresh policy, prompt over the log, return focus}
  - {test: test_tui_live.py, contract: live tail on open/refresh, navigation pauses, end resumes, wheel pauses, finished logs open at top, unchanged refresh stays clean}
  - {test: test_tui_mouse.py, contract: "mouse decode and copy-on-select: press/drag/release cells, ignored buttons, reverse drag, click without motion, copy failure still clears, clamping"}
  - {test: test_tui_select.py, contract: selection ordering/spans/text, OSC 52 base64 and tmux passthrough, helper fallback, transport failure}
  - {test: test_tui_frame.py, contract: first paint, silent identical frame, row-only repaint, stale-cell clearing, resize/invalidate, cursor visibility, bottom-right safety}
  - {test: test_tui_sections.py, contract: running/queued/done order, queued label, newest-first done rows, glyphs, fitted rows, disk fallback}
  - {test: test_tui_prompt.py, contract: prompt overlay over an open log, task body without a log, log window shrinking above the prompt}

support:
  module: tests/support.py
  provides: [sandbox, fixed run ids, event builders, record writers, run_py]
  sandbox: redirects LOOP_ROOT, LOOP_RUNS, LOOP_REGISTRY, LOOP_AUTH_FILE and clears the other known LOOP_* keys
  rule: tests must never write the real .logs/ or use the network

recipes:
  existing_behavior:
    - find the path in manifest.files and read its role
    - read the owning module and the nearest test
    - make the smallest change that preserves AGENTS.md invariants
    - add or update a focused test
    - keep the module under 200 lines; split instead of appending
    - run the verification ladder
    - update docs only if public behavior, commands, paths or the contract changed
  new_module:
    - create harness/<name>.py (or tui/, scripts/, tests/) under 200 lines
    - "register manifest.files[] with a kind and a role: module, entry, test, tool, doc, etc."
    - import it from the owner; do not add a second top-level entry point
    - add a focused test if it contains logic
    - run python3 scripts/check_manifest.py and python3 run.py check lines
  entrypoint:
    - implement main(argv) in a module
    - "add an entrypoints[] row: id, module, function, network, args_usage, role and the exit codes/writes/reads that apply"
    - run.py uses the row for dispatch and usage; do not hardcode a command
    - tests/test_manifest.py imports every entry point; keep it importable
    - if offline and deterministic, add it to checks[]
    - if networked or expensive, set network true and keep it out of the offline ladder
  test:
    - create tests/test_<area>.py
    - use tests.support.sandbox() and fixed ids; never touch the real .logs/
    - "name the behavior: test_newest_run_wins, not test_resolve_2"
    - prefer pure functions; use run_py() for CLI coverage
    - keep it under 200 lines and register it with kind test
    - add the file and its contract to test_map below
    - run the single test during development, then the full suite
  mobile:
    - keep app code under mobile/ and the server bridge in harness/mob*.py
    - "the connected screen is home.dart over task_list.dart, activity_view.dart, workspace_view.dart and prompt_box.dart: floating Gruvbox prompt and nav rail over tasks/activity/workspace tabs"
    - "keep the Gruvbox system: palette and type in theme.dart, shared backdrop/header/cards in widgets.dart, animated nav in navigation.dart, rounded fields in connect_pane.dart, and call cards plus one result callout in run_screen.dart"
    - server route changes go in mobapi.py; HTTP/auth/lifecycle changes go in mobserve.py
    - add a Python test for the server and a Flutter test for the protocol, widget state or layout
    - run "python3 -m unittest tests.test_mobile_api tests.test_mobile_http tests.test_mobile_workspaces"
    - run "cd mobile && flutter analyze --no-pub && flutter test --no-pub"
    - build with "flutter build apk --release --target-platform android-arm64 --split-per-abi"
  scenario:
    - choose or add a fixture under fixtures/
    - "write scenarios/<id>.json with id, sim, label, fixture, purpose, expected, steps"
    - sim is sim1 or sim2; loading under the wrong sim fails
    - label defaults to id and names .logs/<sim>/<label>/
    - fixture defaults to ws1; it is copied, never mounted in place
    - "exec fields: argv required; cwd, stdin, timeout_ms optional (default cwd is the run workspace, timeout 10000 ms)"
    - "edit is sim2 only: path, old, new; exactly one match is required"
    - run python3 run.py sim1 <id> or sim2 <id> and inspect .logs/<sim>/<label>/log.json and obs/
    - register the file in manifest.files[] with kind data
    - add {id, sim, fixture, steps, purpose, expected} to manifest.scenarios[]; steps must match the JSON length
    - add a checks[] row when it is a regression guard, with network false
    - keep scenarios small; they are executable documentation
  manifest_check:
    - make the command deterministic, offline and runnable from the tree root
    - 'add to manifest.checks[]: {"id","argv","expect_exit","network":false,"note"}'
    - use an exact exit code; verify.py treats a mismatch as failure
    - prefer commands that fail loudly and print one line of diagnosis
    - run python3 scripts/verify.py --only <id> and then make verify
    - if the command needs the daemon, keep server/api in argv so --skip-server can exclude it
  record_schema:
    - records are frozen artifacts; recschema validates exactly the fields in manifest.record and rejects unknown fields
    - prefer a new event type or an explicit version bump plus a reader path
    - update manifest.record.events and manifest.record.types
    - update tests/test_recschema.py, tests/test_recread.py, tests/test_recwrite.py, tests/test_view.py and fixtures
    - keep end the only completion marker and seq contiguous
    - run the full ladder and python3 run.py view --schema
  verify_command:
    - update harness/verifier.py for execution and harness/fold.py for pending-command recovery
    - keep the order declaration (ran=false) -> terminal turn -> result (ran=true) -> end
    - update tests/test_verify.py and the verify event in manifest.record and docs/agent/RECORD.yaml
    - "run: python3 -m unittest tests.test_verify and python3 run.py view --schema"
  tool_or_observation:
    - update harness/tools.py, harness/observe.py or harness/spawn.py; read/next: lives in harness/read.py, multi-hunk edit in harness/edits.py, shell classification in harness/cmds.py
    - update tests/test_tools.py, tests/test_observe.py, tests/test_bound.py, tests/test_spawn.py, tests/test_read.py, tests/test_edits.py or tests/test_cmds.py
    - a new tool needs a tools.SIGNATURES entry plus an api.TOOLS schema; tests/test_tools.py fails when the two disagree, and the header renders from SIGNATURES
    - update manifest.wire shape/threshold text and the docs/agent/WIRE.yaml tool block in the same commit
    - exercise python3 run.py sim1 edge and python3 run.py sim2 edge2
    - after a real run: python3 scripts/call_audit.py RUN_ID to see call shapes, failures and refetched reads
  cache_prefix:
    - keep api.header(), the tool schema and the observation rendering byte-identical on replay; run-specific values enter after the wire event
    - update harness/api.py, harness/observe.py, harness/ledger.py or harness/turn.py and the matching tests
    - update the wire event in manifest.record and docs/agent/RECORD.yaml when its payload changes
    - "run make audit RUN=<id>: require prefix_ok=True and no suspected cache breaks on a real record"
  tui:
    - keep it a renderer over daemon snapshots; never add queue or run authority
    - "define every color role in tui/theme.py: grey scale (muted, body, strong) plus muted state hues (accent, ok, warn, err); keep -1 background; no bold; reverse video is reserved for the drag-copy highlight in tui/frame.py; use the selection marker and key glyphs"
    - update tui/rows.py, tui/panes.py, tui/theme.py, tui/input.py, tui/keys.py, tui/nav.py, tui/render.py, tui/indicator.py, tui/logview.py or tui/frame.py and the matching tests; drag-copy owns tui/mouse.py, tui/select.py, tui/clipboard.py and tui/highlight.py
    - task focus carries one flat selection over running, queued and done; queue and done windows scroll to keep it visible; wheel or shift+arrows free-scroll the done viewport, or the queue viewport when the selection is in the queue, without moving the selection, and any selection key re-anchors; queue focus remains for reorder and drop
    - "ctrl+x cancels the selected row: queued drops, live signals through the daemon cancel command, finished is refused"
    - "log view is a projection of record bytes: add entries in harness/runlog.py, draw in tui/logview.py, keep state in tui/loginput.py; tool calls are one fitted line; the final summary keeps paragraphs and wraps; the window is the terminal body or the body above the prompt; wheel/shift scroll moves the viewport; a live log tail-follows until navigation and end resumes it"
    - "overflowing task queue/done sections and log rows share tui/indicator.py: compute the thumb from the existing window total/visible/scroll, reserve one content cell while it is visible, and draw no bar when everything fits; reuse the same offset for painting and input, clamp it on resize/content changes, and never add a second scroll state"
    - "drag-copy: tui/mouse.py anchors, drags and releases screen cells; tui/select.py turns the range into text; tui/clipboard.py writes OSC 52 plus the first installed wl-copy/xclip/xsel/pbcopy helper; tui/frame.py paints merged reverse-video spans and exposes row text for the copy; shift-drag and non-left buttons are left to the terminal"
    - draw through tui/frame.py, never directly into the curses window from the paint path; resize and ctrl-l call invalidate
    - run python3 run.py check tui
    - server modules must not import tui/
  docs:
    - create docs/agent/NAME.yaml with schema, id, title, read_when, source, verify
    - "keep it dense: facts, tables and commands, not prose; prefer manifest references"
    - add the file to the docs list and routes in docs/agent/index.yaml
    - register it in manifest.files[] with kind doc and a role
    - mirror a new hard rule into manifest.invariants and index.yaml invariants
    - cross-link the owning doc; fix stale links and stale claims in the same commit
    - run make verify

manifest_registration:
  - manifest.json is the contract of record; every file in files[] must exist, be relative, have a kind from the allowed set and a non-empty role
  - every .py under harness/, tui/, tests/ or scripts/ must be registered or scripts/check_manifest.py fails
  - audited kinds for the 200-line limit are module, entry, test and tool, only .py files; docs, data, fixtures, records, configs and CI are not audited
  - a new scenario needs both a data file entry and a scenarios[] row
  - a new check needs argv, an integer expect_exit and a network bool
  - a new entry point needs a callable module.function and a network bool
  - no absolute paths in tracked files; use __file__, LOOP_ROOT, LOOP_RUNS or LOOP_REGISTRY

commit:
  audience: agents
  subject: "type(scope): imperative summary"
  body: "why: the invariant or failure this changes; check: the exact command that proves it; agent: the rule a future agent must follow"
  subject_rules: "feat|fix|refactor|test|docs|chore|perf|build|ci|revert, optional (scope), colon, 3..100 chars"
  enforced: scripts/commit_check.py enforces the subject and the why and check lines; agent is required by AGENTS.md
  rules:
    - one logical change per commit
    - do not mix a refactor, a feature and a manifest update
    - never commit .logs/, __pycache__/, credentials, generated blobs or .ruff_cache/
  after_commit:
    - python3 scripts/commit_check.py --range HEAD~1..HEAD
    - git status --short

definition_of_done:
  - python3 run.py --json exits 0 and parses as loop-index/1
  - python3 -m compileall -q harness tui run.py exits 0
  - python3 run.py check lines exits 0 with over=0
  - python3 run.py check tui exits 0
  - python3 -m unittest discover -s tests -t . exits 0
  - python3 scripts/check_manifest.py exits 0
  - python3 scripts/verify.py --skip-server exits 0
  - "when the wire prefix, observation rendering or record schema changed: make audit RUN=<id> reports prefix_ok=True with no suspected cache breaks"
  - "when tool call shapes changed: python3 scripts/call_audit.py RUN_ID reports no unexpected fail kinds or refetched reads"
  - git status --short is clean except intended files
  - commit subject and body pass scripts/commit_check.py
  - any changed public behavior is reflected in manifest.json and docs/agent/ in the same commit

ci:
  file: .github/workflows/ci.yml
  trigger: [push, pull_request, workflow_dispatch]
  python: "3.12 on Ubuntu; 15-minute timeout"
  steps: [compile, line and tui audits, check_manifest, unittest, verify --skip-server, tracked-file secret scan, git status --porcelain]
  rule: keep the tree clean; CI fails on untracked or modified files left by a check

long_run_workflow:
  goal: "finish 400 turns without a total cap while keeping the cached prefix stable and output small"
  steps:
    - [1, "use the compact default: LOOP_CONTEXT_HIGH=64000, LOOP_CONTEXT_LOW=32000, LOOP_KEEP_TURNS=16"]
    - [2, "batch independent reads in one assistant message; read one file with read(path=...) and run the printed next: line, or let read-like exec output keep a contiguous head up to 8192 bytes"]
    - [3, "on a length stop the harness records the truncated turn, escalates to LOOP_MAX_TOKENS, and retries; split a write if it repeats"]
    - [4, "on a 5xx/429/network error the harness emits retry events and resumes the turn; a context 400 forces one compact"]
    - [5, "after the run, audit: make audit RUN=... and make output RUN=...; compact breaks should be separated from accidental breaks"]
  evidence:
    - [tests/test_turn_budget.py, "400 turns reach done with no cap"]
    - [tests/test_loop_compaction.py, "400 turns compact, bounded context, output escalation, context-error recovery"]
    - [tests/test_context_compact.py, "deterministic digest and checkpoint context"]
    - [tests/test_retry.py, "transient retry, auth fatal, context classification"]
    - [tests/test_obs_read.py, "contiguous read window and stderr tail"]
    - [tests/test_read.py, "numbered ranges, find+ctx and offset paging with a resuming next: line"]
    - [tests/test_bad_args.py, "malformed arguments are answered, never dispatched as {}"]
    - [tests/test_call_audit.py, "call shapes, fails and refetches from record bytes"]
